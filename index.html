<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube error 153 means the embed reached it without a usable Referer.
     A no-referrer policy guarantees that, so ask for the one YouTube wants. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: #000; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%;
               border: 0; object-fit: contain; background: #000;
               transition: opacity .65s ease; }
  #stage > .fresh   { opacity: 0; }
  #stage > .leaving { opacity: 0; pointer-events: none; }

  #off { background: #000; }


  /* ---- idle: dusk over the water, the mark mirrored on it --------------- */
  #idle {
    color: #f7f3ee;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(to bottom,
      #05040c 0%, #181030 24%, #3e2244 44%, #8a4a3e 58%, #d0804a 65%,
      #4e2a30 67.5%, #1a1020 78%, #04030a 100%);
  }

  /* the sun's glow at the line - breathes very slowly */
  .sun { position: absolute; left: 50%; top: 67%; width: 115vw; height: 60vh;
         transform: translate(-50%, -50%);
         background: radial-gradient(ellipse, rgba(255,180,110,.45), rgba(255,140,80,.14) 42%, transparent 66%);
         animation: breathe 9s ease-in-out infinite; }

  /* cloud bands catching the last light, drifting so slowly you never see it */
  .clouds { position: absolute; inset: 0; overflow: hidden; }
  .clouds u { position: absolute; display: block; border-radius: 50%;
              background: linear-gradient(to bottom, rgba(255,200,150,.9), rgba(120,60,80,.9));
              filter: blur(14px); animation: drift linear infinite; }

  .horizon { position: absolute; left: 0; right: 0; top: 67%; height: 1px; z-index: 3;
             background: linear-gradient(to right, transparent, rgba(255,210,160,.75), transparent); }

  /* a soft column of the sun's light laid down the water */
  .path { position: absolute; left: 50%; top: 67%; width: 27vw; height: 33%;
          transform: translateX(-50%); z-index: 1; filter: blur(10px);
          background: linear-gradient(to bottom, rgba(255,170,110,.22), rgba(255,150,100,.06) 55%, transparent);
          -webkit-mask-image: linear-gradient(to right, transparent, #000 30%, #000 70%, transparent);
                  mask-image: linear-gradient(to right, transparent, #000 30%, #000 70%, transparent); }

  /* the mark, mirrored below the line and wavering faintly */
  .refl { position: absolute; left: 50%; top: 67.5%; width: 47vw; max-width: 1000px; z-index: 2;
          transform: translateX(-50%) scaleY(-1); opacity: .19; filter: blur(2.5px);
          -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 88%);
                  mask-image: linear-gradient(to top, #000 0%, transparent 88%);
          animation: waver 7s ease-in-out infinite; }
  .refl img { width: 100%; display: block; }

  .vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none;
              background: radial-gradient(ellipse at 50% 55%, transparent 50%, rgba(0,0,0,.55) 100%); }

  /* ---- content ---------------------------------------------------------- */
  .frame { position: absolute; inset: 0; z-index: 5;
           display: grid; grid-template-rows: 1fr auto 1fr; place-items: center; }
  .centre { grid-row: 2; text-align: center; transform: translateY(-17.5vh); }

  .mark { display: block; width: 47vw; max-width: 1000px; margin: 0 auto;
          filter: drop-shadow(0 6px 30px rgba(0,0,0,.35)); }

  .time { margin-top: 6vh; font-weight: 200; font-size: 5.2vw; line-height: 1;
          letter-spacing: -.01em; text-shadow: 0 4px 24px rgba(0,0,0,.35);
          transition: opacity .45s ease; }
  .time.fading { opacity: 0; }
  .time .ampm { font-size: .38em; font-weight: 300; letter-spacing: .06em;
                margin-left: .3em; vertical-align: .45em; opacity: .6; }

  .meta { margin-top: 2.4vh; font-weight: 300; font-size: 1.1vw; letter-spacing: .3em;
          text-transform: uppercase; opacity: .62; }
  .meta .sep { margin: 0 .9em; opacity: .5; }

  .ver { position: absolute; right: 2.2vw; bottom: 2.6vh; z-index: 6;
         font-size: .8vw; font-weight: 300; letter-spacing: .18em; color: rgba(255,255,255,.14); }

  .msg .time, .msg .meta { display: none; }
  .msg .headline { margin-top: 6vh; font-weight: 300; font-size: 2.6vw; letter-spacing: .3em; }
  .msg .sub { margin-top: 1.6vh; font-size: 1.05vw; letter-spacing: .24em;
              text-transform: uppercase; opacity: .62; }

  @keyframes breathe { 0%, 100% { opacity: .92; } 50% { opacity: 1; } }
  @keyframes waver   { 0%, 100% { transform: translateX(-50%) scaleY(-1) scaleX(1); }
                       50%      { transform: translateX(-50%) scaleY(-1.015) scaleX(1.006); } }
  @keyframes drift   { from { transform: translateX(0); } to { transform: translateX(6vw); } }
</style>
</head>

  function twelveHour(clock) {
    var m = /^(\d{1,2}):(\d{2})/.exec(clock || '');
    if (!m) return { t: '--:--', ap: '' };
    var h = +m[1], ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return { t: h + ':' + m[2], ap: ap };
  }

    if (e.date) parts.push(e.date);
    if (e.temp != null) parts.push(Math.round(e.temp) + '&deg;' + (e.weather ? ' ' + e.weather : ''));
    return parts.join('<span class="sep">&middot;</span>');
  }

  var CLOUDS = [

  function skyLayers() {
    var c = '';
    CLOUDS.forEach(function (k, i) {
      c += '<u style="left:' + k.l + '%;top:' + k.t + '%;width:' + k.w + 'vw;height:' + k.h +
           'vh;opacity:' + k.o + ';animation-duration:' + k.d + 's;animation-delay:-' +

           '<div class="vignette"></div>';

  function idleContent(message, sub) {
    var e  = env || {};
    var tt = twelveHour(e.clock);

      : '<div class="time">' + tt.t + '<span class="ampm">' + tt.ap + '</span></div>' +
        '<div class="meta">' + metaLine(e) + '</div>';

      '<div class="frame' + (message ? ' msg' : '') + '">' +

    d.id = 'idle';
    d.innerHTML = idleContent(message, sub);

    idleState  = { message: message, sub: sub };
    shownClock = env && env.clock;

  // The only motion on the screen: when the minute changes, the old time
  // fades out and the new one fades in. Everything else updates in place.
  function refreshIdle() {
    var d = document.getElementById('idle');
    if (!d || !idleState || idleState.message) return;

    var e    = env || {};
    var meta = d.querySelector('.meta');
    if (meta) meta.innerHTML = metaLine(e);

    var time = d.querySelector('.time');
    if (!time || e.clock === shownClock) return;

    var tt    = twelveHour(e.clock);
    var first = (shownClock == null);
    shownClock = e.clock;

    // change gets the fade

      time.innerHTML = tt.t + '<span class="ampm">' + tt.ap + '</span>';
      return;

    time.classList.add('fading');
    setTimeout(function () {
      time.innerHTML = tt.t + '<span class="ampm">' + tt.ap + '</span>';
      time.classList.remove('fading');
    }, 460);
  }

  // ---- what kind of link is this ----------------------------------------
  function youtubeId(u) {
    var m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

    var m = u.match(/twitch\.tv\/([A-Za-z0-9_]+)/);
    return (m && m[1] !== 'videos') ? m[1] : null;
  }

  function twitchVideo(u) {
    var m = u.match(/twitch\.tv\/videos\/(\d+)/);
    return m ? m[1] : null;
  }

    v.playsInline = true;
    v.addEventListener('loadedmetadata', function () {

      }
      v.play().catch(function () {});
    });

  }

    tag.src = 'https://www.youtube.com/iframe_api';

  // the module and picking a track; turning them OFF is selecting no track -

    var tries = 0;
    ccTimer = setInterval(function () {
      if (!cur || cur.api !== api || !want.subtitles) {
        clearInterval(ccTimer); ccTimer = null; return;
      }
      if (++tries > 20) {
        clearInterval(ccTimer); ccTimer = null;
        return;
      }
      var picked = false;
      ['captions', 'cc'].forEach(function (m) {
        if (picked) return;
        call(function () {
          var list = api.getOption(m, 'tracklist') || [];
          if (!list.length) return;
          var track = list.filter(function (t) { return /^en/i.test(t.languageCode || ''); })[0] || list[0];
          api.setOption(m, 'track', { languageCode: track.languageCode });
          api.setOption(m, 'reload', true);
          picked = true;
        });
      });
      if (picked) { clearInterval(ccTimer); ccTimer = null; }
    }, 250);
  }

  function applyVolume() {
    if (!cur) return;
    var v = want.muted ? 0 : want.volume;

    if (cur.kind === 'file' && cur.el) {
      cur.el.muted  = (v <= 0);
      cur.el.volume = v;
      return;
    }

    if (!cur.api) return;

    if (cur.kind === 'youtube') {
      if (v <= 0) {
        if (cur.api.mute) cur.api.mute();
      } else {
        if (cur.api.unMute) cur.api.unMute();
        if (cur.api.setVolume) cur.api.setVolume(Math.round(v * 100));
      }
      return;
    }

    if (cur.kind === 'twitch') {
      if (cur.api.setMuted) cur.api.setMuted(v <= 0);
      if (cur.api.setVolume) cur.api.setVolume(v);
    }
  }

  function playYouTube(id) {
    clear();
    var holder = document.createElement('div');
    stage.appendChild(holder);
    cur = { kind: 'youtube', el: holder, api: null };

    withYT(function () {
      if (!cur || cur.el !== holder) return;      // switched away while loading

      var ref = want.origin || 'https://www.youtube.com';
      cur.api = new window.YT.Player(holder, {
        videoId: id,
        host: want.nocookie ? 'https://www.youtube-nocookie.com'
                            : 'https://www.youtube.com',
        playerVars: {
          autoplay: 1, controls: 0, modestbranding: 1, rel: 0,
          playsinline: 1, disablekb: 1, fs: 0, iv_load_policy: 3,
          cc_load_policy: want.subtitles ? 1 : 0,
          start: Math.floor(want.seek),
          origin: ref, widget_referrer: ref
        },
        events: {
          onReady: function (e) {
            if (want.seek > 0) e.target.seekTo(want.seek, true);
            e.target.playVideo();

            // onReady can fire fractionally before the player will accept a
            // volume, which is why videos started at full blast whatever the
            // pad said. Re-assert it for a moment rather than trusting one go.
            var tries = 0;
            var settle = setInterval(function () {
              if (!cur || cur.api !== e.target || ++tries > 12) {
                clearInterval(settle);
                return;
              }
              applyVolume();
              // only if nothing is already searching for a track
              if (tries === 3 && want.subtitles && !ccTimer) applySubtitles();
            }, 250);
          }
        }
      });
    });
  }

  // Twitch's embed player crashes CEF outright - libcef.dll+33416D4, taking
  // the whole game with it. A source that cannot play is a nuisance; one that
  // crashes the client is not acceptable, so it is refused up front and says
  // so on the screen. Set twitch:true in the show message to try it anyway.
  function playTwitch(url) {
    idle('TWITCH NOT SUPPORTED', 'its player crashes the game client');
    cur = { kind: 'blocked', el: stage.firstChild };
  }

  function off() {
    clear();
    var d = document.createElement('div');
    d.id = 'off';
    stage.appendChild(d);
    idleState = null;
    cur = null;
  }

  // Whatever is on the screen fades out, then the next thing fades in. Used
  // for every change - a video starting or stopping, the screen going off
  // or on - so nothing ever cuts.
  var FADE = 650;
  function swap(build) {
    var old = stage.firstElementChild;

    var finish = function () {
      build();
      var next = stage.firstElementChild;
      if (!next) return;
      next.classList.add('fresh');
      void next.offsetWidth;                 // commit the starting opacity
      next.classList.remove('fresh');
    };

    if (!old) { finish(); return; }
    old.classList.add('leaving');
    setTimeout(function () {
      if (old.parentNode) old.parentNode.removeChild(old);
      finish();
    }, FADE);
  }

  function start() {
    if (want.power === false) { swap(off); return; }
    if (!want.url || !want.playing) { swap(idle); return; }

    var yt = youtubeId(want.url);
    if (yt) return swap(function () { playYouTube(yt); });
    if (/twitch\.tv/i.test(want.url)) return swap(function () { playTwitch(want.url); });
    swap(function () { playFile(want.url); });
  }

  // ---- the pad talks to us ----------------------------------------------
  window.addEventListener('message', function (e) {
    var d = e.data || {};

    if (d.action === 'show') {
      // Only a new source or a power change rebuilds the player. Volume and
      // mute must never restart the video - they used to, because the mute
      // flag was part of this comparison.
      var power   = (d.power !== false);
      var rebuild = (d.url !== want.url) || (!!d.playing !== want.playing)
                 || (power !== want.power);

      want.power   = power;
      want.url     = d.url || null;
      want.playing = !!d.playing;
      want.seek    = d.seek || 0;
      want.muted   = (d.muted === true);   // absent means not muted
      want.volume  = (d.volume == null ? 1 : d.volume);
      want.origin  = d.origin || null;
      want.nocookie = !!d.nocookie;
      var subsChanged = (!!d.subtitles !== !!want.subtitles);
      want.subtitles = !!d.subtitles;

      if (rebuild) start(); else { applyVolume(); if (subsChanged) applySubtitles(); }
      return;
    }

    // distance falloff for anything we cannot route through the 3D graph
    if (d.action === 'volume') {
      want.volume = d.volume;
      applyVolume();
      return;
    }

    if (d.action === 'env') {
      env = d.env || null;
      refreshIdle();
      return;
    }

    if (d.action === 'stop') {
      want.playing = false;
      idle();
      return;
    }

    // keep the picture with the server clock after a long stall
    if (d.action === 'resync' && cur && cur.kind === 'file' && cur.el) {
      var v = cur.el;
      if (isFinite(v.duration) && v.duration > 0) {
        var target = d.seek % v.duration;
        if (Math.abs(v.currentTime - target) > 1.5) {
          try { v.currentTime = target; } catch (e) {}
        }
      }
    }
  });

  idle();
})();

</script>
</body>
</html>
