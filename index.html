<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Smart Home</title>
<style>
:root {
  --ink:        #111114;
  --ink-soft:   #86868b;
  --line:       #ececef;
  --surface:    #ffffff;
  --tile:       #f5f5f7;
  --dark:       #1c1c1e;
  --dark-tile:  #2b2b2e;
  --sidebar:    #242426;
  --sidebar-on: #3a3a3d;
  --green:      #34c759;
  --accent:     #dfeaf7;
  --accent-ink: #123a63;
  --radius:     14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

/* the YouTube players live here: present in the DOM so they play, but
   0x0 and off-screen so nothing is ever visible */
#yt-host {
  position: fixed; top: -10px; left: -10px;
  width: 1px; height: 1px; overflow: hidden;
  opacity: 0; pointer-events: none;
}
#yt-host iframe { width: 1px; height: 1px; border: 0; }

/* ---------------------------------------------------------------- shell */

.root {
  position: fixed; inset: 0;
  display: grid; place-items: center;
}

.scrim {
  position: absolute; inset: 0;
  background: transparent;   /* never use backdrop-filter here - CEF renders
                                the whole NUI page opaque black if you do */
}

.tablet {
  position: relative;
  width: min(1140px, 90vw);
  height: min(790px, 88vh);
  animation: rise .26s cubic-bezier(.2, .8, .3, 1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px) scale(.985); }
  to   { opacity: 1; transform: none; }
}

.bezel {
  position: relative;
  width: 100%; height: 100%;
  background: #0e0e10;
  border: 1px solid #4a4a4f;
  border-radius: 32px;
  padding: 16px;
  box-shadow: 0 40px 90px rgba(0, 0, 0, .55), inset 0 0 0 6px #1a1a1d;
}

.screen {
  display: flex;
  width: 100%; height: 100%;
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
}

.home-bar {
  position: absolute;
  left: 50%; bottom: 22px;
  width: 190px; height: 5px;
  transform: translateX(-50%);
  background: #3d3d41;
  border-radius: 3px;
}

/* -------------------------------------------------------------- sidebar */

.sidebar {
  flex: 0 0 218px;
  background: var(--sidebar);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 26px 12px 24px;
}

.nav { display: flex; flex-direction: column; gap: 4px; }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px;
  border: 0; border-radius: 10px;
  background: transparent;
  color: #a1a1a6;
  font: 500 14px var(--font);
  cursor: pointer;
  text-align: left;
  transition: background .15s, color .15s;
}

.nav-item:hover { color: #e6e6e8; background: rgba(255, 255, 255, .05); }
.nav-item.is-active { background: var(--sidebar-on); color: #fff; }

.nav-item svg {
  width: 17px; height: 17px; flex: 0 0 17px;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.nav-item[data-view="home"] svg { fill: none; }

.brand { padding: 0 2px; }
.brand-logo { display: block; width: 100%; height: auto; }
.brand-mark {
  font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
  font-style: italic;
  font-size: 26px;
  color: #f2f2f4;
  line-height: 1;
  white-space: nowrap;
}
.brand-rule { height: 1px; background: #5a5a5f; margin: 9px 0 7px; }
.brand-sub {
  font-size: 10px; letter-spacing: .22em;
  color: #b8b8bd; text-transform: uppercase;
  margin-top: 8px;
}
.brand-sub:empty { display: none; }

/* ---------------------------------------------------------------- main */

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 26px 0;
}

.tabs { display: flex; gap: 26px; }

.tab {
  border: 0; background: none; cursor: pointer;
  font: 500 14px var(--font);
  color: var(--ink-soft);
  padding: 0 0 4px;
  transition: color .15s;
}
.tab:hover { color: #4a4a4f; }
.tab.is-active { color: var(--ink); }

.status {
  display: flex; align-items: center; gap: 7px;
  color: #4a4a4f; font-size: 11px; font-weight: 500;
}
.ico-wifi { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.battery {
  display: inline-block; width: 22px; height: 11px;
  border: 1.4px solid #4a4a4f; border-radius: 3px;
  position: relative;
}
.battery i { position: absolute; inset: 1.5px; background: #4a4a4f; border-radius: 1px; }
.battery::after {
  content: ""; position: absolute; right: -4px; top: 3px;
  width: 2px; height: 5px; background: #4a4a4f; border-radius: 0 1px 1px 0;
}

.content {
  flex: 1; min-height: 0;
  padding: 16px 26px 26px;
  overflow-y: auto;
  border-top: 1px solid var(--line);
  margin-top: 14px;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #d8d8dd; border-radius: 3px; }

/* ---------------------------------------------------------------- cards */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: start;   /* cards keep their natural height */
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}

.card--dark { background: var(--dark); border-color: var(--dark); color: #fff; }

.card-visual {
  height: 150px;
  background: var(--tile);
  position: relative;
  overflow: hidden;
  flex: 0 0 150px;
}
.card--dark .card-visual { background: var(--dark-tile); }

.card-dots {
  position: absolute; top: 10px; right: 10px;
  width: 24px; height: 18px;
  border: 0; background: none; cursor: default;
  color: #9a9aa0; letter-spacing: 1px; font-size: 13px; line-height: 1;
}

.card-body { padding: 12px 14px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.card-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.card-meta  { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
.card--dark .card-meta { color: #a1a1a6; }

/* toggle */
.toggle {
  flex: 0 0 auto;
  width: 44px; height: 26px;
  border: 0; border-radius: 999px;
  background: #e5e5ea;
  position: relative; cursor: pointer;
  transition: background .2s;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  transition: transform .2s cubic-bezier(.3, .8, .4, 1);
}
.toggle.is-on { background: var(--green); }
.toggle.is-on::after { transform: translateX(18px); }
.card--dark .toggle { background: #48484c; }
.card--dark .toggle.is-on { background: var(--green); }

/* control row */
.card-control { padding: 0 14px 14px; }

.range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 2px;
  background: #e5e5ea; outline: none; cursor: pointer;
}
.card--dark .range { background: #48484c; }
.range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; border: 1px solid rgba(0, 0, 0, .14);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
  cursor: grab;
}
.range:active::-webkit-slider-thumb { cursor: grabbing; }
.range:disabled { opacity: .5; cursor: default; }

.presets { display: flex; gap: 6px; margin-top: 11px; }
.presets--main { margin-top: 2px; gap: 7px; }
.presets--main .preset { padding: 10px 4px; font-size: 12px; }

.row-presets { margin-top: 0; flex: 0 0 auto; min-width: 250px; }

.preset {
  flex: 1;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  padding: 6px 4px;
  font: 500 11px var(--font);
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, color .15s, border-color .15s;
}
.preset:hover { background: #f2f2f4; color: var(--ink); }
.card--dark .preset { border-color: #3d3d41; color: #a1a1a6; }
.card--dark .preset:hover { background: #3a3a3d; color: #fff; }
.preset.is-current { border-color: var(--green); color: var(--green); }
.card--dark .preset.is-current { border-color: var(--green); color: var(--green); background: rgba(52, 199, 89, .10); }

/* window illustration -------------------------------------------------- */

.window {
  position: absolute; inset: 15px 34px;
  border-radius: 3px; overflow: hidden;
  background: linear-gradient(#9cc6e8 0%, #cfe4f5 56%, #c3d9bb 56%, #a9c6a0 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .07);
}
.card--dark .window { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }

.window .sun {
  position: absolute; right: 17%; top: 13%;
  width: 19px; height: 19px; border-radius: 50%;
  background: #ffe9ae; box-shadow: 0 0 15px 5px rgba(255, 233, 174, .6);
}
.window .hill {
  position: absolute; left: -10%; bottom: 44%;
  width: 56%; height: 17%;
  border-radius: 50% 50% 0 0;
  background: #93b58c;
}
.window .hill--far {
  left: auto; right: -14%; bottom: 44%;
  width: 46%; height: 12%;
  background: #a6c39d;
}

.window .mullion {
  position: absolute; left: 50%; top: 0; bottom: 0;
  width: 2px; margin-left: -1px;
  background: rgba(255, 255, 255, .75);
}

.rail {
  position: absolute; left: 0; right: 0; top: 0;
  height: 7px; z-index: 3;
  background: linear-gradient(#efeee8, #dbdad2);
  border-bottom: 1px solid #c2c1b8;
}

.blind {
  position: absolute; left: 0; top: 7px; right: 0;
  height: 0%;
  z-index: 2;
  background:
    repeating-linear-gradient(to bottom,
      #f2f1eb 0px, #f2f1eb 5px,
      #dcdbd3 5px, #dcdbd3 6px);
  border-bottom: 2px solid #c2c1b8;
  box-shadow: 0 4px 8px rgba(0, 0, 0, .25);
}

.lit-btn {
  width: 20px; height: 20px; flex: 0 0 20px;
  border: 1px solid var(--line); border-radius: 50%;
  background: transparent; cursor: pointer;
  display: grid; place-items: center; color: #b9b9c0;
  transition: color .15s, border-color .15s, box-shadow .15s;
}
.lit-btn svg { width: 11px; height: 11px; fill: none; stroke: currentColor;
               stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.lit-btn.is-on {
  color: var(--ink); border-color: rgba(0,0,0,.28);
}
.card--dark .lit-btn.is-on { color: #fff; border-color: rgba(255,255,255,.4); }

.flat-tag--warn {
  background: rgba(224, 122, 95, .16); color: #a8452c;
}

.cc-btn {
  flex: 0 0 auto; margin-left: 6px; padding: 3px 7px;
  border: 1px solid var(--line); border-radius: 5px; background: transparent;
  cursor: pointer; font: 700 10px var(--font); letter-spacing: .06em; color: #b9b9c0;
}
.cc-btn.is-on { color: var(--ink); border-color: var(--ink); }
.card--dark .cc-btn.is-on { color: #fff; border-color: #fff; }

.playbtn {
  width: 46px; height: 46px; flex: 0 0 46px;
  border: 0; background: transparent; cursor: pointer; border-radius: 8px;
  display: grid; place-items: center; color: var(--ink);
  transition: background .15s;
}
.playbtn:hover { background: rgba(0,0,0,.06); }
.card--dark .playbtn { color: #fff; }
.card--dark .playbtn:hover { background: rgba(255,255,255,.1); }
.playbtn svg { width: 30px; height: 30px; fill: currentColor; }

/* two quads forming a triangle, morphing into two bars. Same point count in
   both, so the transition slides the corners rather than cutting. */
.playbtn .pp {
  d: path("M 6 5 L 12.5 8.75 L 12.5 15.25 L 6 19 Z M 12.5 8.75 L 19 12 L 19 12 L 12.5 15.25 Z");
  transition: d .24s cubic-bezier(.4, 0, .2, 1);
}
.playbtn.is-on .pp {
  d: path("M 6 5 L 10 5 L 10 19 L 6 19 Z M 14 5 L 18 5 L 18 19 L 14 19 Z");
}

.card--screen .card-visual { display: grid; place-items: center; }
.tv {
  width: 74%; aspect-ratio: 16/9; border-radius: 5px;
  background: #16161a; box-shadow: inset 0 0 0 2px rgba(255,255,255,.07);
  display: grid; place-items: center; overflow: hidden;
  transition: background .25s, box-shadow .25s;
}
.tv.is-off { background: #0a0a0c; box-shadow: inset 0 0 0 2px rgba(255,255,255,.04); }
.tv.is-on {
  background: linear-gradient(115deg, #1d3b56, #2b6f8f 45%, #17323f);
  box-shadow: inset 0 0 0 2px rgba(120,200,240,.25), 0 0 18px rgba(70,150,200,.28);
}
.tv-face {
  font: 500 9px var(--font); letter-spacing: .2em; color: #3a3a44;
}

/* lift platform -------------------------------------------------------- */

.platform { position: absolute; inset: 22px 30px; }
.platform-base {
  position: absolute; left: 8%; right: 8%; bottom: 0; height: 16%;
  border-radius: 3px;
  background: linear-gradient(#c9c9d0, #a9a9b2);
}
.card--dark .platform-base { background: linear-gradient(#3d3d45, #2d2d34); }
.platform-deck {
  position: absolute; left: 0; right: 0; bottom: 14%; height: 26%;
  border-radius: 4px;
  background: linear-gradient(#f2f2f5, #cbcbd3);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
  transform: translateY(46%);
  transition: transform .1s linear;
}
.card--dark .platform-deck { background: linear-gradient(#75757e, #4b4b54); }

/* water feature -------------------------------------------------------- */

.basin {
  position: absolute; inset: 20px 26px;
  border-radius: 5px; overflow: hidden;
  background: linear-gradient(#d9d9de, #c6c6cd);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.card--dark .basin { background: linear-gradient(#4a4a51, #33333a); }

.basin-water {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(115deg,
      rgba(255,255,255,.22) 0 6px, rgba(255,255,255,0) 6px 13px),
    linear-gradient(#4d9fd6, #2f6f9e);
}

.riser {
  position: absolute; left: 50%; bottom: 6%;
  width: 26%; height: 58%;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(#ececed, #b9b9c1);
  box-shadow: 0 -2px 6px rgba(0, 0, 0, .25);
  transform: translate(-50%, 100%);
  transition: opacity .2s;
  opacity: 0;
}
.card--dark .riser { background: linear-gradient(#6d6d75, #45454d); }

.card--mover.is-busy .preset { opacity: .45; cursor: default; }

.lid {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background: linear-gradient(#f0f0f3, #d5d5db);
  transition: transform .12s linear;
}
.card--dark .riser {
  position: absolute; left: 50%; bottom: 6%;
  width: 26%; height: 58%;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(#ececed, #b9b9c1);
  box-shadow: 0 -2px 6px rgba(0, 0, 0, .25);
  transform: translate(-50%, 100%);
  transition: opacity .2s;
  opacity: 0;
}
.card--dark .riser { background: linear-gradient(#6d6d75, #45454d); }

.card--mover.is-busy .preset { opacity: .45; cursor: default; }

.lid { background: linear-gradient(#57575f, #3c3c43); }
.lid--a { left: 0;  box-shadow: 2px 0 5px rgba(0,0,0,.22); }
.lid--b { right: 0; box-shadow: -2px 0 5px rgba(0,0,0,.22); }

/* scenes tile ---------------------------------------------------------- */

.scene-visual { display: flex; align-items: center; justify-content: center; gap: 14px; }

.mini {
  position: relative;
  width: 52px; height: 66px;
  border-radius: 3px; overflow: hidden;
  background: linear-gradient(#9cc6e8 0%, #cfe4f5 56%, #c3d9bb 56%, #a9c6a0 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.mini::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0;
  background: repeating-linear-gradient(to bottom,
    #f2f1eb 0px, #f2f1eb 4px, #dcdbd3 4px, #dcdbd3 5px);
  border-bottom: 2px solid #c2c1b8;
}
.mini--open::after   { height: 7px; }
.mini--closed::after { height: 100%; }

/* speaker card --------------------------------------------------------- */

.speaker-visual {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}

.grille {
  width: 74px; height: 74px;
  border-radius: 14px;
  background:
    radial-gradient(circle at 3px 3px, rgba(0,0,0,.30) 1.1px, transparent 1.2px) 0 0 / 7px 7px,
    linear-gradient(160deg, #3a3a3f, #202024);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 2px 6px rgba(0,0,0,.18);
  position: relative;
}
.grille span {
  position: absolute; left: 50%; transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #55555c, #1a1a1e 70%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.4);
}
.grille span:nth-child(1) { width: 34px; height: 34px; top: 10px; }
.grille span:nth-child(2) { width: 20px; height: 20px; bottom: 9px; }
.grille span:nth-child(3) { width: 6px; height: 6px; bottom: 16px; background: #6f6f78; }

.eq--lg { height: 26px; gap: 3.5px; }
.eq--lg i { width: 4px; }
.eq--lg i:nth-child(5) { height: 65%; animation-delay: .68s; }

.card--speaker .station-row {
  display: flex; align-items: center; gap: 4px;
  margin: 0 14px 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.station-name {
  flex: 1; min-width: 0; text-align: center;
  font-size: 13px; font-weight: 500; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card--speaker.is-live .station-name { color: var(--ink); }

.card--speaker .step-btn {
  border: 0; background: none;
  width: 24px; height: 24px; flex: 0 0 24px;
  color: #bcbcc2; font-size: 17px;
}
.card--speaker .step-btn:hover { background: none; color: var(--ink); }

/* accent tile ---------------------------------------------------------- */

.card--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  justify-content: center;
  padding: 22px;
  cursor: pointer;
  transition: filter .15s;
}
.card--accent:hover { filter: brightness(.97); }
.card--accent h3 {
  font-size: 23px; font-weight: 400;
  letter-spacing: .02em; text-transform: uppercase;
  line-height: 1.22;
}
.card--accent .chev {
  position: absolute; top: 20px; right: 20px;
  width: 16px; height: 16px;
  fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round;
}

/* audio card ----------------------------------------------------------- */

.panel--audio { padding: 15px 18px 8px; }
.card--radio  { grid-column: span 2; padding: 16px 18px 10px; gap: 0; }

.radio-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}

.eq-btn {
  border: 1px solid var(--line); background: transparent;
  border-radius: 8px; padding: 6px 13px;
  font: 600 11px var(--font); letter-spacing: .1em;
  color: var(--ink-soft); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.eq-btn:hover { background: var(--tile); color: var(--ink); }
.eq-btn.is-on { border-color: var(--green); color: #1f7a3a; background: rgba(52,199,89,.08); }

/* rooms ---------------------------------------------------------------- */

.rooms { display: flex; flex-direction: column; }

.room {
  display: grid;
  grid-template-columns: 1fr 1.1fr 1.2fr;
  align-items: center; gap: 12px;
  padding: 11px 0;
}
.room + .room, .picker + .room { border-top: 1px solid #f4f4f6; }

.room-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.room-btns { display: flex; align-items: center; gap: 8px; }

.play-btn {
  width: 26px; height: 26px; flex: 0 0 26px;
  border: 1px solid var(--line); border-radius: 50%;
  background: #fff; cursor: pointer;
  display: grid; place-items: center;
  color: var(--ink);
  transition: background .15s, border-color .15s, opacity .15s;
}
.play-btn svg { width: 12px; height: 12px; fill: currentColor; }
.play-btn:hover { background: var(--tile); }
.play-btn.is-off { opacity: .45; }
.room.is-live .play-btn { border-color: rgba(52,199,89,.45); color: #1f7a3a; }
.room-name { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.room.is-live .room-name { color: var(--ink); }

.room-source {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: 100%; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px;
  background: transparent; cursor: pointer;
  padding: 7px 9px;
  font: 500 12px var(--font); color: var(--ink-soft);
  transition: background .15s, color .15s, border-color .15s;
}
.room-source:hover { background: var(--tile); color: var(--ink); }
.room.is-live .room-source { border-color: rgba(52,199,89,.4); color: var(--ink); }
.room-source-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flat-tag {
  flex: 0 0 auto;
  font-size: 8.5px; letter-spacing: .1em; font-weight: 600;
  color: #a9a9b0; border: 1px solid var(--line);
  border-radius: 3px; padding: 1px 4px;
}

.chev-sm { width: 13px; height: 13px; flex: 0 0 13px; fill: none; stroke: currentColor; stroke-width: 2; }

.room-vol { display: flex; align-items: center; gap: 9px; }
.room-pct {
  flex: 0 0 38px; text-align: right;
  font-size: 11px; font-weight: 500; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.range--vol { flex: 1; }

/* source picker -------------------------------------------------------- */

.picker {
  border: 1px solid var(--line); border-radius: 10px;
  background: #fafafb; padding: 12px; margin: 2px 0 10px;
}
.pick-zone {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: #a9a9b0; margin-bottom: 12px;
}
.pick-section + .pick-section {
  margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line);
}
.pick-sub {
  font-size: 11px; color: var(--ink-soft);
  margin: 0 0 9px; line-height: 1.45;
}

.pick-head {
  font-size: 12px; font-weight: 600; letter-spacing: 0;
  text-transform: none; color: var(--ink); margin-bottom: 3px;
}
.pick-list { display: flex; flex-direction: column; gap: 4px; max-height: 168px; overflow-y: auto; }
.pick {
  text-align: left; border: 0; border-radius: 7px;
  background: transparent; cursor: pointer;
  padding: 8px 10px; font: 500 12.5px var(--font); color: var(--ink);
}
.pick:hover { background: #eeeef1; }
.pick.is-current { color: #1f7a3a; background: rgba(52,199,89,.10); }
.pick-empty { font-size: 12px; color: var(--ink-soft); padding: 6px 2px; }

.pick-note {
  font-size: 11px; color: var(--ink-soft);
  margin-top: 7px; line-height: 1.45;
}
.pick-note.is-bad { color: #c0392f; }

.pick-url { display: flex; gap: 7px; margin-top: 10px; }
.pick-url input {
  flex: 1; min-width: 0;
  border: 1px solid var(--line); border-radius: 7px;
  padding: 8px 10px; font: 400 12px var(--font); color: var(--ink);
  background: #fff; outline: none;
}
.pick-url input:focus { border-color: #c9c9d0; }
.pick-url input.is-bad { border-color: #e0483f; }
.pick-import { border-color: rgba(52,199,89,.45); color: #1f7a3a; }
.pick-import:hover { background: rgba(52,199,89,.08); }

.pick-add {
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
  padding: 0 14px; font: 500 12px var(--font); color: var(--ink); cursor: pointer;
}
.pick-add:hover { background: var(--tile); }

/* eq ------------------------------------------------------------------- */

.eq-panel { padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.eq-band { display: flex; align-items: center; gap: 11px; padding: 5px 0; }
.eq-label {
  flex: 0 0 42px; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-soft);
}
.range--eq { flex: 1; }
.eq-val {
  flex: 0 0 56px; text-align: right;
  font-size: 11px; font-weight: 500; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.eq-note {
  font-size: 11px; color: var(--ink-soft);
  margin-top: 10px; line-height: 1.45;
}

.eq-presets { margin-top: 10px; }
.eq-presets .preset { padding: 7px 4px; }

.tile--doors {
  display: flex; align-items: center; justify-content: space-between;
  border: 0; cursor: pointer; text-align: left;
  border-radius: var(--radius); padding: 18px 22px;
  background: #ecedf1; color: #4a4a52; font: 600 15px var(--font);
  transition: background .15s, color .15s;
}
.tile--doors:hover { background: #e3e4ea; }
.tile--doors.is-locked { background: rgba(240,183,86,.14); color: #8a6520; }
.tile-sub { display: block; font-size: 11px; font-weight: 400; opacity: .7; margin-top: 3px; }

.doors-screen { padding: 4px 0 8px; }
.doors-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 14px; margin-bottom: 18px;
}
.doors-group { margin-bottom: 16px; }
.doors-room {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 7px;
}
.door-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 9px; background: var(--tile);
}
.door-row + .door-row { margin-top: 5px; }
.door-name { flex: 1; font-size: 13px; color: var(--ink); }

/* privacy lock -------------------------------------------------------- */

.tile--privacy {
  display: flex; align-items: center; justify-content: space-between;
  border: 0; cursor: pointer; text-align: left;
  border-radius: var(--radius); padding: 20px 22px;
  background: #ecedf1; color: #4a4a52;
  font: 600 15px var(--font); letter-spacing: .01em;
  transition: background .15s, color .15s;
}
.tile--privacy:hover { background: #e3e4ea; }
.tile--privacy.is-open { background: rgba(52,199,89,.12); color: #1f7a3a; }
.tile-lock { width: 22px; height: 22px; fill: none; stroke: currentColor;
             stroke-width: 1.7; stroke-linecap: round; }

.lockscreen {
  display: flex; flex-direction: column; align-items: center;
  padding: 26px 0 8px; text-align: center;
}
.lock-big {
  width: 34px; height: 34px; margin-bottom: 14px;
  fill: none; stroke: var(--ink-soft); stroke-width: 1.5; stroke-linecap: round;
}
.lock-title { font-size: 19px; font-weight: 600; color: var(--ink); }
.lock-sub {
  font-size: 12.5px; color: var(--ink-soft);
  margin: 6px 0 22px; transition: color .15s;
}
.lock-sub.is-bad { color: #c0392f; }

.lockscreen .pad { width: 232px; }
.pad-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.pad-dots i {
  width: 11px; height: 11px; border-radius: 50%;
  border: 1px solid #c6c6cd; background: transparent;
  transition: background .12s, border-color .12s, transform .12s;
}
.pad-dots i.is-set { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }

.pad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  border: 1px solid var(--line); border-radius: 50%;
  background: transparent; cursor: pointer;
  aspect-ratio: 1; font: 400 19px var(--font); color: var(--ink);
  transition: background .12s;
}
.key:hover { background: var(--tile); }
.key--alt { color: var(--ink-soft); font-size: 16px; }
.key--go  { color: #1f7a3a; border-color: rgba(52,199,89,.45); }

.lock-back {
  margin-top: 20px; border: 0; background: transparent; cursor: pointer;
  font: 500 12px var(--font); color: var(--ink-soft);
}
.lock-back:hover { color: var(--ink); }

@keyframes padshake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.pad.is-bad { animation: padshake .34s ease; }

.preset--wide { margin-top: 16px; padding: 9px 20px; }

/* light wave ----------------------------------------------------------- */

.wave-visual { display: grid; place-items: center; }

.wave-row {
  display: flex; align-items: flex-start; gap: 5px;
  height: 74%; width: 78%;
}
.wave-row i {
  flex: 1;
  height: 34%;
  border-radius: 2px;
  background: linear-gradient(#dfe6ec, #aeb9c4);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  transition: transform .05s linear;
}
.card--dark .wave-row i { background: linear-gradient(#7f8b97, #4a545e); }
.card--device.card--wave .card-visual { background: var(--tile); }
.card--dark.card--wave .card-visual { background: var(--dark-tile); }

.wave-speed { display: flex; align-items: center; gap: 10px; }

.wave-speed-label {
  flex: 0 0 auto; font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft);
}
.card--dark .wave-speed-label { color: rgba(255,255,255,.55); }
.wave-speed .range { flex: 1; }
.wave-speed-val {
  flex: 0 0 42px; text-align: right;
  font-size: 11px; font-weight: 500; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.card--dark .wave-speed-val { color: rgba(255,255,255,.7); }

/* camera card ---------------------------------------------------------- *//* code lock ------------------------------------------------------------ */

.lock-visual { display: grid; place-items: center; }
.door-frame {
  position: relative; width: 58%; height: 72%;
  border-radius: 4px; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2c2c33 0 8px, #33333b 8px 16px);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.door-slab {
  position: absolute; inset: 0 auto 0 0; width: 100%;
  background: linear-gradient(#dfe0e4, #b6b8bf);
  box-shadow: 2px 0 8px rgba(0,0,0,.35);
  transition: transform .1s linear;
}
.card--dark .door-slab { background: linear-gradient(#6a6a73, #43434b); }

.pad-dots { display: flex; justify-content: center; gap: 9px; margin-bottom: 11px; }
.pad-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid var(--line); background: transparent;
  transition: background .12s, border-color .12s;
}
.pad-dots i.is-set { background: var(--ink); border-color: var(--ink); }
.card--dark .pad-dots i.is-set { background: #fff; border-color: #fff; }

.pad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key {
  border: 1px solid var(--line); border-radius: 8px;
  background: transparent; cursor: pointer;
  padding: 9px 0; font: 500 14px var(--font); color: var(--ink);
  transition: background .12s;
}
.key:hover { background: var(--tile); }
.card--dark .key { color: #fff; border-color: rgba(255,255,255,.16); }
.card--dark .key:hover { background: rgba(255,255,255,.08); }
.key--alt { color: var(--ink-soft); }
.key--go { color: #1f7a3a; border-color: rgba(52,199,89,.45); }

@keyframes padshake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.pad.is-bad { animation: padshake .32s ease; }

/* light wave ----------------------------------------------------------- */

.wave-visual { display: grid; place-items: center; }

.wave-row {
  display: flex; align-items: flex-start; gap: 5px;
  height: 74%; width: 78%;
}
.wave-row i {
  flex: 1;
  height: 34%;
  border-radius: 2px;
  background: linear-gradient(#dfe6ec, #aeb9c4);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
  transition: transform .05s linear;
}
.card--dark .wave-row i { background: linear-gradient(#7f8b97, #4a545e); }
.card--device.card--wave .card-visual { background: var(--tile); }
.card--dark.card--wave .card-visual { background: var(--dark-tile); }

.wave-speed { display: flex; align-items: center; gap: 10px; }
.wave-speed-label {
  flex: 0 0 auto; font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft);
}
.card--dark .wave-speed-label { color: rgba(255,255,255,.55); }
.wave-speed .range { flex: 1; }
.wave-speed-val {
  flex: 0 0 42px; text-align: right;
  font-size: 11px; font-weight: 500; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.card--dark .wave-speed-val { color: rgba(255,255,255,.7); }

/* camera card ---------------------------------------------------------- */

.cam-visual {
  background: linear-gradient(155deg, #26262a, #131316);
  position: relative; overflow: hidden;
  display: grid; place-items: center;
}
.cam-lens {
  width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #5a6b7a 0%, #1b2a36 45%, #070c11 75%);
  box-shadow: inset 0 0 0 4px #2c2c31, inset 0 0 14px rgba(0,0,0,.8), 0 0 22px rgba(80,140,190,.20);
  position: relative;
}
.cam-lens::after {
  content: ""; position: absolute; top: 12px; left: 14px;
  width: 12px; height: 7px; border-radius: 50%;
  background: rgba(255,255,255,.32); transform: rotate(-25deg);
}
.cam-scan {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom,
    rgba(255,255,255,.045) 0 1px, transparent 1px 4px);
  pointer-events: none;
}
.cam-rec {
  position: absolute; top: 10px; right: 12px;
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; letter-spacing: .16em; color: #d9d9de;
}
.cam-rec i {
  width: 6px; height: 6px; border-radius: 50%; background: #e0483f;
  animation: rec 1.6s ease-in-out infinite;
}
@keyframes rec { 0%, 45% { opacity: 1; } 55%, 100% { opacity: .18; } }

.preset--wide { flex: 1; }

/* environment ---------------------------------------------------------- */

.panel--env { padding: 15px 18px 14px; }

.wx-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wx-clock {
  font-size: 34px; font-weight: 250; letter-spacing: -.02em;
  line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums;
}
.wx-day { font-size: 11px; color: var(--ink-soft); margin-top: 5px; }

.wx-badge {
  width: 40px; height: 40px; flex: 0 0 40px;
  border-radius: 10px; background: var(--tile);
  display: grid; place-items: center; color: #6a6a72;
}
.wx-icon { width: 24px; height: 24px; }

.wx-cond {
  font-size: 13px; font-weight: 500; color: var(--ink);
  margin: 12px 0 2px;
}

.panel--env .readouts { gap: 26px; margin-top: 10px; }
.panel--env .readout-val { font-size: 22px; }

.wx-next {
  margin-top: 11px; padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 11px; color: var(--ink-soft);
}
.wx-blend { color: #b0b0b6; }

/* env strip ------------------------------------------------------------ */

.strip {
  display: grid;
  grid-template-columns: 1.75fr 1fr;
  align-items: start;
  gap: 14px; margin-top: 14px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.panel-label { font-size: 11px; color: var(--ink-soft); }

.np { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.np-title { font-size: 24px; font-weight: 300; letter-spacing: -.01em; flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-title.is-off { color: #b6b6bb; }

.np-head { display: flex; align-items: center; justify-content: space-between; }
.np-foot { font-size: 11px; color: var(--ink-soft); margin-top: 9px; }
.np-nav { display: flex; gap: 6px; flex: 0 0 auto; }

.toggle--sm { width: 36px; height: 21px; }
.toggle--sm::after { width: 17px; height: 17px; }
.toggle--sm.is-on::after { transform: translateX(15px); }

.step-btn {
  flex: 0 0 26px;
  width: 26px; height: 26px;
  border: 1px solid var(--line); border-radius: 50%;
  background: #fff; color: var(--ink-soft);
  font-size: 15px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.step-btn:hover { background: var(--tile); color: var(--ink); }

.eq.is-off i { animation: none; transform: scaleY(.3); background: #cfcfd4; }

.eq { display: flex; align-items: flex-end; gap: 2.5px; height: 20px; }
.eq i {
  width: 3px; background: #3d9bf0; border-radius: 1px;
  animation: eq 1.05s ease-in-out infinite;
}
.eq i:nth-child(1) { height: 40%; animation-delay: 0s; }
.eq i:nth-child(2) { height: 85%; animation-delay: .17s; }
.eq i:nth-child(3) { height: 55%; animation-delay: .34s; }
.eq i:nth-child(4) { height: 100%; animation-delay: .51s; }
@keyframes eq { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }

.readouts { display: flex; gap: 34px; margin-top: 8px; }
.readout-val { font-size: 26px; font-weight: 300; letter-spacing: -.01em; }
.readout-val sup { font-size: 14px; font-weight: 400; vertical-align: super; margin-left: 2px; }

/* list / rooms / empty ------------------------------------------------- */

.section-head {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-soft);
  margin: 4px 0 10px;
}
.section + .section { margin-top: 22px; }

.row {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.row + .row { margin-top: 8px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 14px; font-weight: 600; }
.row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.row .range { max-width: 210px; }

.empty {
  border: 1px dashed #dcdce1;
  border-radius: var(--radius);
  padding: 44px 26px;
  text-align: center;
}
.empty h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.empty p  { font-size: 13px; color: var(--ink-soft); }

.info-row {
  display: flex; justify-content: space-between; gap: 20px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.info-row span:first-child { color: var(--ink-soft); }
.info-row span:last-child  { font-weight: 500; }

.btn {
  margin-top: 18px;
  border: 1px solid var(--line);
  background: var(--tile);
  border-radius: 10px;
  padding: 10px 18px;
  font: 500 13px var(--font);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { background: #ebebef; }

.dot-on  { color: var(--green); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

  function ctx() {
    if (!AC) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { AC = new Ctx(); } catch (e) { return null; }
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }

  function audio() {
    if (S.ui.sounds === false) return null;
    return ctx();
  }

  // one short filtered blip
  function blip(freq, ms, gain, type, slideTo) {
    var ac = audio();
    if (!ac) return;

    var vol = (S.ui.soundVolume == null ? 0.5 : S.ui.soundVolume) * gain;
    if (vol <= 0) return;

    var t0  = ac.currentTime;
    var osc = ac.createOscillator();
    var amp = ac.createGain();
    var lp  = ac.createBiquadFilter();

    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + ms / 1000);

    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(5200, t0);

    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);

    osc.connect(lp); lp.connect(amp); amp.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + ms / 1000 + 0.02);
  }

  var Sound = {
    tap:    function () { blip(1180, 45,  0.16, 'sine'); },
    press:  function () { blip(880,  70,  0.20, 'sine', 1460); },
    on:     function () { blip(660,  60,  0.20, 'sine'); setTimeout(function () { blip(990, 90, 0.18, 'sine'); }, 55); },
    off:    function () { blip(990,  60,  0.18, 'sine'); setTimeout(function () { blip(620, 95, 0.16, 'sine'); }, 55); },
    tick:   function () { blip(2100, 22,  0.07, 'square'); },
    open:   function () { blip(520,  90,  0.16, 'sine', 880); setTimeout(function () { blip(1320, 120, 0.10, 'sine'); }, 70); },
    close:  function () { blip(880,  90,  0.14, 'sine', 460); }
  };

  function post(name, data) {
    if (!IS_NUI) return Promise.resolve();
    return fetch('https://' + RES + '/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(data || {})
    }).catch(function () {});
  }

  function device(id) {
    for (var i = 0; i < S.devices.length; i++) {
      if (S.devices[i].id === id) return S.devices[i];
    }
    return null;
  }

  // Mirrors RFSH.BuildTravel / RFSH.TravelAt in shared/lib.lua so the card
  // illustration eases at exactly the same moments the real prop does.
  function ease(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    if (u < 0.5) return 4 * u * u * u;
    var f = (2 * u) - 2;
    return 0.5 * f * f * f + 1;
  }

  function buildTravel(dev, from, to) {
    if (dev.type === 'mover') {
      var opening = to > from;
      var span    = opening ? (dev.openTotal || dev.travelTime || 2500)
                            : (dev.closeTotal || dev.travelTime || 2500);

      var mt = { from: from, to: to, total: 0, linear: true,
                 dir: opening ? 'open' : 'close' };

      var md = Math.abs(to - from) / 100;
      if (md < 1e-6) return mt;

      mt.total = Math.max(100, span * md);
      return mt;
    }

    var n  = dev.steps || 0;
    var T  = dev.sectionTime || 1000;
    var tr = { from: from, to: to, n: Math.max(n, 1), segs: [], total: 0, w: 0, p0: 0, p1: 0 };
    if (n <= 0) return tr;

    var p0 = (from / 100) * n, p1 = (to / 100) * n;
    tr.p0 = p0; tr.p1 = p1;
    if (Math.abs(p1 - p0) < 1e-6) return tr;

    var w    = Math.max(0, Math.min(1, dev.ratchet == null ? 0 : dev.ratchet));
    var span = Math.abs(p1 - p0);
    if (dev.ratchetFalloff && span > 1) w = w / span;
    tr.w = w;

    var dir = p1 > p0 ? 1 : -1, cur = p0, guard = 0;

    while (guard++ < 64) {
      var nxt = dir > 0 ? Math.floor(cur + 1e-6) + 1 : Math.ceil(cur - 1e-6) - 1;
      if (dir > 0 && nxt > p1) nxt = p1;
      if (dir < 0 && nxt < p1) nxt = p1;

      var len = Math.abs(nxt - cur);
      if (len > 1e-6) {
        var dur = len * T;
        tr.segs.push({ from: cur, to: nxt, start: tr.total, dur: dur });
        tr.total += dur;
      }

      cur = nxt;
      if (Math.abs(cur - p1) < 1e-6) break;
    }

    return tr;
  }

  // Same blend of the stepped curve and the continuous glide that the props
  // run, so the illustration and the real blind move as one.
  function travelAt(tr, elapsed) {
    if (!tr || tr.total <= 0) return tr ? tr.to : 0;
    if (elapsed <= 0)        return tr.from;
    if (elapsed >= tr.total) return tr.to;

    // a mover's master clock is linear; each stage eases itself
    if (tr.linear) return tr.from + (tr.to - tr.from) * (elapsed / tr.total);

    var stepped = tr.p1;
    for (var i = 0; i < tr.segs.length; i++) {
      var seg = tr.segs[i];
      if (elapsed < seg.start + seg.dur) {
        var u = (elapsed - seg.start) / seg.dur;
        stepped = seg.from + (seg.to - seg.from) * ease(u);
        break;
      }
    }

    var glide = tr.p0 + (tr.p1 - tr.p0) * ease(elapsed / tr.total);
    var p     = glide + (stepped - glide) * tr.w;

    return (p / tr.n) * 100;
  }

  // --------------------------------------------------- spatial audio
  //
  // The panel's page stays alive for the whole session, on screen or not, so
  // it can hold the house audio. A PannerNode sits at the speaker's world
  // position, the listener follows the player, and the audio engine does the
  // falloff and the panning.

  var Audio3D = (function () {
    var sources = {};
    var eq      = { low: 0, mid: 0, high: 0 };

    var pool = document.createElement('div');
    pool.id = 'audio-pool';
    pool.style.display = 'none';
    document.body.appendChild(pool);

    function place(panner, c) {
      if (panner.positionX) {
        panner.positionX.value = c.x;
        panner.positionY.value = c.y;
        panner.positionZ.value = c.z;
      } else {
        panner.setPosition(c.x, c.y, c.z);
      }
    }

    // low shelf, mid peak, high shelf. Gains are dB, applied to every source.
    function buildEq(c) {
      var low  = c.createBiquadFilter();
      var mid  = c.createBiquadFilter();
      var high = c.createBiquadFilter();

      low.type  = 'lowshelf';  low.frequency.value  = 200;
      mid.type  = 'peaking';   mid.frequency.value  = 1000; mid.Q.value = 0.9;
      high.type = 'highshelf'; high.frequency.value = 3200;

      low.connect(mid); mid.connect(high);
      return { low: low, mid: mid, high: high, input: low, output: high };
    }

    function applyEq(s) {
      if (!s.eq) return;
      var c   = ctx();
      var now = c ? c.currentTime : 0;

      [['low', s.eq.low], ['mid', s.eq.mid], ['high', s.eq.high]].forEach(function (pair) {
        var node = pair[1];
        var val  = Math.max(-12, Math.min(12, eq[pair[0]] || 0));
        if (node.gain.setTargetAtTime && c) node.gain.setTargetAtTime(val, now, 0.05);
        else node.gain.value = val;
      });
    }

    // Slide an AudioParam instead of stepping it. .value = x is a
    // discontinuity, and a discontinuity every update is audible as crackle.
    function glide(param, value, dur) {
      var c = ctx();
      if (!c) { param.value = value; return; }

      var now = c.currentTime;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(value, now + Math.max(0.008, dur));
    }

    function ramp(param, target, ms) {
      var c = ctx();
      if (!c) { param.value = target; return; }

      var now = c.currentTime;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(target, now + Math.max(0.01, (ms || 0) / 1000));

      try { s.el.pause(); s.el.removeAttribute('src'); s.el.load(); } catch (e) {}
      try { if (s.el.parentNode) s.el.parentNode.removeChild(s.el); } catch (e) {}
      ['src', 'fade', 'vol'].forEach(function (n) {
        try { if (s[n] && s[n].disconnect) s[n].disconnect(); } catch (e) {}
      });
      (s.panners || []).forEach(function (pn) {
        try { pn.disconnect(); } catch (e) {}
      });
      if (s.eq) {
        try { s.eq.low.disconnect(); s.eq.mid.disconnect(); s.eq.high.disconnect(); } catch (e) {}
      }
    }

    // Fade out and only then tear down, so leaving a room or switching one off
    // never cuts. Immediate is for resource shutdown.
    function stop(id, fadeMs, immediate) {
      var s = sources[id];
      if (!s) return;
      delete sources[id];

      if (immediate || !s.fade) { teardown(s); return; }

      ramp(s.fade.gain, 0, fadeMs);
      setTimeout(function () { teardown(s); }, (fadeMs || 0) + 120);
    }

    function play(d) {
      var prev = sources[d.id];

      // Same source coming back? Keep playing, just retarget and refade.
      if (prev && prev.url === d.url) {
        if (d.coords) place(prev.panner, d.coords);
        prev.vol.gain.value = clampVol(d.volume);
        ramp(prev.fade.gain, 1, d.fade);
        return;
      }

      // Different source: hand the old one a fade out while the new one fades
      // in, so switching tracks or rooms crossfades instead of cutting.
      var resumeAt = 0;
      if (prev) {
        if (prev.url === d.url) resumeAt = prev.el.currentTime;
        delete sources[d.id];
        ramp(prev.fade.gain, 0, d.fade);
        setTimeout((function (old) { return function () { teardown(old); }; })(prev),
                   (d.fade || 0) + 120);
      }

      var sp = d.spatial || {};
      var audioEl = document.createElement('audio');
      audioEl.loop = true;
      audioEl.preload = 'auto';
      audioEl.dataset.sourceId = d.id;

      var remote = /^https?:\/\//i.test(d.url);
      if (remote && sp.crossOrigin !== false) audioEl.crossOrigin = 'anonymous';
      audioEl.src = d.url;

      // The server owns the clock, so a zone you walk back into is already
      // part-way through - and two players in the room hear the same point.
      if (d.seek > 0) {
        audioEl.addEventListener('loadedmetadata', function () {
          var dur = audioEl.duration;
          if (dur && isFinite(dur) && dur > 0) {
            try { audioEl.currentTime = d.seek % dur; } catch (e) {}
          }
        }, { once: true });
      }
      if (resumeAt) { try { audioEl.currentTime = resumeAt; } catch (e) {} }
      pool.appendChild(audioEl);

      // a zone is a list of points; a single coords is just a one-point zone
      var pts = (d.points && d.points.length) ? d.points : [d.coords];

      var s = { el: audioEl, url: d.url, coords: pts[0], points: pts, sp: sp,
                mode: sp.mode || 'full', room: d.room };

      if (s.mode === 'distance') {
        audioEl.volume = 0;
        s.vol = { gain: { value: clampVol(d.volume) } };   // shim, used by listener()
        s.fadeValue = 0;
        s.fadeTarget = 1;
        s.fadeMs = d.fade || 0;
        s.fadeStart = performance.now();
      } else {
        var c = ctx();
        if (!c) { console.error('rf_rsm1h: no AudioContext'); return; }

        var src  = c.createMediaElementSource(audioEl);
        var band = buildEq(c);
        var fade = c.createGain();
        var vol  = c.createGain();

        // One element feeding a panner per speaker point. Separate elements
        // per speaker would drift apart and phase against each other; this
        // way every point carries the same audio, just placed differently.
        var panners = s.points.map(function (pt) {
          var pn = c.createPanner();
          pn.panningModel  = sp.panningModel  || 'HRTF';
          pn.distanceModel = sp.distanceModel || 'linear';
          pn.refDistance   = sp.refDistance   || 2.5;
          pn.maxDistance   = sp.maxDistance   || 22;
          pn.rolloffFactor = sp.rolloffFactor || 1;
          place(pn, pt);
          return pn;
        });

        // source -> EQ -> 3D -> fade -> volume -> out.
        // fade and volume are separate stages, so changing volume mid-fade
        // multiplies with it rather than fighting it.
        fade.gain.value = 0;
        vol.gain.value  = clampVol(d.volume);

        src.connect(band.input);
        panners.forEach(function (pn) {
          band.output.connect(pn);   // the graph sums them for us
          pn.connect(fade);
        });
        fade.connect(vol);
        vol.connect(c.destination);

        s.src = src; s.eq = band; s.panners = panners; s.fade = fade; s.vol = vol;
        if (d.eq) setEqValues(d.eq);
        applyEq(s);
        ramp(fade.gain, 1, d.fade);
      }

      sources[d.id] = s;

      // 'full' goes through the EQ and the panner; 'distance' does neither,
      // because a tainted element cannot enter the graph at all
      noteSourceMode(d.room, s.mode);

      var report = function (ok, err, mode) {
        post('audioStatus', {
          id: d.id, ok: ok, url: d.url, mode: mode || null,
          error: err ? (err.name + ': ' + err.message) : null,
          ctx: AC ? AC.state : 'none'
        });
      };

      // A remote source that does not send CORS headers cannot go through the
      // Web Audio graph - it loads as silence or fails outright. Retry it once
      // in distance mode, which uses the element directly and needs no CORS.
      var retried = false;
      function retryWithoutGraph(why) {
        if (retried || s.mode === 'distance' || !remote) return false;
        retried = true;

        console.warn('rf_rsm1h: ' + d.url + ' blocked (' + why + '), retrying without the audio graph');
        var fallback = {};
        for (var k in d) fallback[k] = d[k];
        fallback.spatial = {};
        for (var k2 in sp) fallback.spatial[k2] = sp[k2];
        fallback.spatial.mode = 'distance';
        fallback.spatial.crossOrigin = false;

        stop(d.id, 0, true);
        play(fallback);
        return true;
      }

      audioEl.addEventListener('error', function () {
        var e = audioEl.error;
        if (retryWithoutGraph('media error ' + (e && e.code))) return;
        report(false, { name: 'MediaError', message: 'code ' + (e && e.code) });
      }, { once: true });

      if (d.paused) { s.paused = true; return; }

      var pr = audioEl.play();
      if (pr && pr.then) {
        pr.then(function () { report(true, null, s.mode); })
          .catch(function (err) {
            if (retryWithoutGraph(err.name)) return;
            report(false, err);
          });
      } else report(true, null, s.mode);
    }

    function clampVol(v) {
      return Math.max(0, Math.min(100, v == null ? 70 : v)) / 100;
    }

    function pause(id, paused) {
      var s = sources[id];
      if (!s) return;

      s.paused = !!paused;
      if (paused) {
        try { s.el.pause(); } catch (e) {}
      } else {
        var pr = s.el.play();
        if (pr && pr.catch) pr.catch(function () {});
      }
    }

    function volume(id, v) {
      var s = sources[id];
      if (!s) return;
      var target = clampVol(v);

      if (s.mode === 'distance') { s.vol.gain.value = target; return; }
      ramp(s.vol.gain, target, 180);
    }

    function setEqValues(values) {
      eq = {
        low:  values.low  || 0,
        mid:  values.mid  || 0,
        high: values.high || 0
      };
    }

    function setEq(values) {
      setEqValues(values);
      Object.keys(sources).forEach(function (id) { applyEq(sources[id]); });
    }

    function listener(d) {
      var c = ctx();
      if (!c) return;

      var L  = c.listener;
      var dt = d.smooth || 0.1;

      if (L.positionX) {
        glide(L.positionX, d.x,  dt); glide(L.positionY, d.y,  dt); glide(L.positionZ, d.z,  dt);
        glide(L.forwardX, d.fx, dt); glide(L.forwardY, d.fy, dt); glide(L.forwardZ, d.fz, dt);
        L.upX.value = 0; L.upY.value = 0; L.upZ.value = 1;
      } else {
        L.setPosition(d.x, d.y, d.z);
        L.setOrientation(d.fx, d.fy, d.fz, 0, 0, 1);
      }

      // distance mode has no graph, so do falloff, fade and volume by hand
      var now = performance.now();
      Object.keys(sources).forEach(function (id) {
        var s = sources[id];
        if (s.mode !== 'distance') return;

        var dist = Infinity;
        (s.points || [s.coords]).forEach(function (pt) {
          var dx = pt.x - d.x, dy = pt.y - d.y, dz = pt.z - d.z;
          dist = Math.min(dist, Math.sqrt(dx * dx + dy * dy + dz * dz));
        });

        var ref = s.sp.refDistance || 2.5;
        var max = s.sp.maxDistance || 22;
        var f   = dist <= ref ? 1 : (dist >= max ? 0 : 1 - (dist - ref) / (max - ref));

        var fadeF = 1;
        if (s.fadeMs) {
          fadeF = Math.min(1, (now - s.fadeStart) / s.fadeMs);
          s.fadeValue = fadeF;
        }

        s.el.volume = Math.max(0, Math.min(1, f * fadeF * s.vol.gain.value));
      });
    }

    function stopAll(immediate) {
      Object.keys(sources).forEach(function (id) { stop(id, 0, immediate !== false); });
    }

    function debug() {
      var lines = Object.keys(sources).map(function (id) {
        var s = sources[id];
        return id + ' -> ' + s.mode +
               ', paused ' + s.el.paused +
               ', ready ' + s.el.readyState +
               ', paused ' + (!!s.paused) +
               ', fade ' + (s.fade ? s.fade.gain.value.toFixed(2) : '-') +
               ', vol ' + (s.vol && s.vol.gain ? s.vol.gain.value.toFixed(2) : '-') +
               ', src ' + s.el.getAttribute('src');
      });

      post('audioDebug', {
        ctx: AC ? AC.state : 'none',
        count: lines.length,
        sources: lines.concat(['eq low ' + eq.low + ' mid ' + eq.mid + ' high ' + eq.high])
      });
    }

    return { play: play, stop: stop, stopAll: stopAll, volume: volume,
             pause: pause, listener: listener, debug: debug, setEq: setEq };
  })();

  // ------------------------------------------------- youtube playback
  //
  // A cross-origin iframe cannot be routed through the Web Audio graph, so
  // there is no PannerNode here. Distance, fade and volume are folded into
  // one number and pushed to the player's own setVolume, which gives falloff
  // without direction. That is the trade for playing YouTube at all.

  var YTAudio = (function () {
    var players  = {};
    var apiReady = false;
    var pending  = [];
    var titles   = {};

    var host = document.getElementById('yt-host');

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      apiFailed = false;
      pending.splice(0).forEach(function (fn) { fn(); });
    };

    // youtube.com blocked or offline: the callback never fires, so stop
    // queueing requests that can never run and tell the pad why.
    var apiFailed = false;
    setTimeout(function () {
      if (apiReady) return;
      apiFailed = true;
      pending.splice(0).forEach(function (fn) {
        if (fn.reject) fn.reject();
      });
    }, 12000);

    function ensure(id, cb) {
      var rec = players[id];
      if (rec && rec.ready) return cb(rec);
      if (rec) { rec.onReady.push(cb); return; }

      if (apiFailed) {
        post('audioStatus', { id: id, ok: false, url: 'youtube',
          error: 'The YouTube player could not load. Is youtube.com reachable from this client?' });
        return;
      }
      if (!apiReady) {
        var q = function () { ensure(id, cb); };
        q.reject = function () {
          post('audioStatus', { id: id, ok: false, url: 'youtube',
            error: 'The YouTube player could not load. Is youtube.com reachable from this client?' });
        };
        pending.push(q);
        return;
      }

      var div = document.createElement('div');
      div.id = 'ytp-' + id;
      host.appendChild(div);

      rec = {
        ready: false, onReady: [cb], node: div,
        vol: 0.7, fadeFrom: 0, fadeTo: 1, fadeMs: 0, fadeAt: 0,
        coords: { x: 0, y: 0, z: 0 }, sp: {}, paused: false, video: null
      };
      players[id] = rec;

      rec.player = new YT.Player(div.id, {
        height: '0', width: '0', videoId: '',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0 },
        events: {
          onReady: function () {
            rec.ready = true;
            rec.onReady.splice(0).forEach(function (f) { f(rec); });
          },
          onError: function (e) {
            post('audioStatus', { id: id, ok: false, url: 'yt:' + rec.video,
              error: 'YouTube refused that video (code ' + e.data + ')' });
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              try { rec.player.seekTo(0); rec.player.playVideo(); } catch (err) {}
            }
            if (e.data === YT.PlayerState.PLAYING && rec.video) {
              var d = rec.player.getVideoData && rec.player.getVideoData();
              if (d && d.title && titles[rec.video] !== d.title) {
                titles[rec.video] = d.title;
                paintRadio();
              }
            }
          }
        }
      });
    }

    function fadeFactor(rec, now) {
      if (!rec.fadeMs) return rec.fadeTo;
      var p = Math.min(1, (now - rec.fadeAt) / rec.fadeMs);
      return rec.fadeFrom + (rec.fadeTo - rec.fadeFrom) * p;
    }

    function apply(rec, listener) {
      if (!rec.ready || !rec.player.setVolume) return;

      var f = 1;
      if (listener) {
        // a cross-origin player has one volume, so the nearest speaker wins
        var dist = Infinity;
        (rec.points || [rec.coords]).forEach(function (pt) {
          var dx = pt.x - listener.x, dy = pt.y - listener.y, dz = pt.z - listener.z;
          dist = Math.min(dist, Math.sqrt(dx * dx + dy * dy + dz * dz));
        });
        var ref  = rec.sp.refDistance || 2.5;
        var max  = rec.sp.maxDistance || 22;
        f = dist <= ref ? 1 : (dist >= max ? 0 : 1 - (dist - ref) / (max - ref));
      } else if (rec.lastF != null) {
        f = rec.lastF;
      }
      rec.lastF = f;

      var g = f * fadeFactor(rec, performance.now()) * rec.vol;
      try { rec.player.setVolume(Math.max(0, Math.min(100, Math.round(g * 100)))); } catch (e) {}
    }

    function play(d) {
      ensure(d.id, function (rec) {
        rec.coords = d.coords || rec.coords;
        rec.points = (d.points && d.points.length) ? d.points : [rec.coords];
        rec.sp     = d.spatial || rec.sp;
        rec.vol    = Math.max(0, Math.min(100, d.volume == null ? 70 : d.volume)) / 100;
        rec.paused = !!d.paused;

        rec.fadeFrom = 0; rec.fadeTo = 1;
        rec.fadeMs = d.fade || 0; rec.fadeAt = performance.now();

        if (rec.video !== d.video) {
          rec.video = d.video;
          try { rec.player.loadVideoById(d.video); } catch (e) {}
        }

        try {
          rec.player.setVolume(0);
          rec.player.unMute();
          if (rec.paused) rec.player.pauseVideo(); else rec.player.playVideo();
        } catch (e) {}

        apply(rec, null);
        noteSourceMode(d.room, 'youtube');
        post('audioStatus', { id: d.id, ok: true, url: 'yt:' + d.video, mode: 'youtube' });
      });
    }

    function stop(id, fadeMs) {
      var rec = players[id];
      if (!rec) return;
      delete players[id];

      rec.fadeFrom = fadeFactor(rec, performance.now());
      rec.fadeTo = 0; rec.fadeMs = fadeMs || 0; rec.fadeAt = performance.now();

      var steps = setInterval(function () { apply(rec, null); }, 60);
      setTimeout(function () {
        clearInterval(steps);
        try { rec.player.stopVideo(); rec.player.destroy(); } catch (e) {}
        if (rec.node && rec.node.parentNode) rec.node.parentNode.removeChild(rec.node);
      }, (fadeMs || 0) + 150);
    }

    return {
      play: play,
      stop: stop,
      volume: function (id, v) {
        var rec = players[id];
        if (!rec) return;
        rec.vol = Math.max(0, Math.min(100, v)) / 100;
        apply(rec, null);
      },
      pause: function (id, paused) {
        var rec = players[id];
        if (!rec || !rec.ready) return;
        rec.paused = !!paused;
        try { paused ? rec.player.pauseVideo() : rec.player.playVideo(); } catch (e) {}
      },
      listener: function (d) {
        Object.keys(players).forEach(function (id) { apply(players[id], d); });
      },
      stopAll: function () { Object.keys(players).forEach(function (id) { stop(id, 0); }); },
      title: function (video) { return titles[video] || null; },
      count: function () { return Object.keys(players).length; }
    };
  })();

  // the card animates off the same cosine, so it reads like the real row
  function wavePeriod(dev) {
    var slow = dev.periodMax || 12000;
    var fast = dev.periodMin || 1500;
    var pct  = Math.max(0, Math.min(100, dev.speed == null ? 67 : dev.speed)) / 100;
    return slow - (slow - fast) * pct;
  }

  // mirrors the settle ramp the props use, so the card reads the same
  function rampOf(r, now, fallback) {
    if (!r) return fallback;
    if (!r.ms) return r.to;

    var u = (now - r.start) / r.ms;
    if (u <= 0) return r.from;      // a ramp scheduled ahead holds: the delay
    if (u >= 1) return r.to;
    return r.from + (r.to - r.from) * ease(u);
  }

  function blendOf(dev, now) {
    return rampOf(S.waveBlend[dev.id], now, ((S.display[dev.id] || 0) >= 50) ? 1 : 0);
  }

  function restOf(dev, now) {
    var fallback = (dev.height == null ? 100 : dev.height) / 100;
    return rampOf(S.waveRest[dev.id], now, fallback);
  }

  function setWaveHeight(dev, height) {
    var now  = performance.now();
    var prev = restOf(dev, now);
    dev.height = height;
    S.waveRest[dev.id] = { from: prev, to: height / 100,
                           ms: dev.levelTime || 1400, start: now };
    startWave();
  }

  function setWaveTarget(dev, on) {
    var now  = performance.now();
    var prev = blendOf(dev, now);
    S.waveBlend[dev.id] = { from: prev, to: on ? 1 : 0,
                            ms: dev.settleTime || 1600,
                            start: now + (dev.startDelay || 0) };
    startWave();
  }

  function waveTick() {
    var any = false;

    S.devices.forEach(function (dev) {
      if (dev.type !== 'wave') return;

      var row = document.querySelector('[data-device="' + dev.id + '"] [data-wave-row]');
      if (!row) return;

      var bars = row.querySelectorAll('[data-wave-bar]');
      if (!bars.length) return;

      any = true;
      var period = wavePeriod(dev);
      var step   = dev.phaseStep || (1 / bars.length);
      var now    = performance.now();
      var blend  = blendOf(dev, now);
      var rest   = restOf(dev, now);

      var bl = S.waveBlend[dev.id], rl = S.waveRest[dev.id];
      var settling = (bl && now < bl.start + bl.ms) || (rl && now < rl.start + rl.ms);
      if (blend > 0.0001 || settling) any = true;

      bars.forEach(function (b, i) {
        var phase = (now / period) - i * step;
        var dip   = (0.5 - 0.5 * Math.cos(2 * Math.PI * phase)) * blend;
        // the swing hangs below wherever the row is resting
        var drop  = (1 - rest) + rest * dip;
        b.style.transform = 'translateY(' + (drop * 58).toFixed(2) + '%)';
      });
    });

    S.waveRunning = any;
    if (any) requestAnimationFrame(waveTick);
  }

  function startWave() {
    if (!S.waveRunning) requestAnimationFrame(waveTick);
  }

  // A file shows its label; a pasted URL shows its last path segment.
  // A source is "flat" when it never enters the Web Audio graph: no EQ, no
  // panner, distance only. That is YouTube always, and any remote file whose
  // host refuses CORS. Recorded from what actually happened, not guessed.
  function noteSourceMode(room, mode) {
    if (!room) return;
    S.flatRooms = S.flatRooms || {};

    var flat = (mode === 'distance' || mode === 'youtube');
    if (S.flatRooms[room] === flat) return;

    S.flatRooms[room] = flat;
    paintRadio();

  function isFlat(spk) {
    if (!spk) return false;
    if (typeof spk.station === 'string' && spk.station.indexOf('yt:') === 0) return true;
    return !!(S.flatRooms && S.flatRooms[spk.id]);
  }

    var list = (S.radio && S.radio.speakers) || [];
    for (var i = 0; i < list.length; i++) if (list[i].power && isFlat(list[i])) return true;
    return false;
  }

  function sourceLabel(id) {
    if (!id) return '-';

    if (id.indexOf('yt:') === 0) {
      var vid = id.slice(3);
      return YTAudio.title(vid) || ('YouTube ' + vid);
    }

    if (id.indexOf('url:') === 0) {
      var u    = id.slice(4);
      var path = u.split('?')[0];
      var last = path.split('/').filter(Boolean).pop() || '';

      // a real filename is the best label; otherwise the host says more
      if (/\.(mp3|ogg|oga|opus|wav|m4a|aac|flac|webm|mp4)$/i.test(last)) return last;
      var host = (u.match(/^https?:\/\/([^/:]+)/i) || [])[1] || u;
      return host.replace(/^www\./, '');
    }

    var st = source(id);
    return st ? st.label : id;

  function fmtDb(v) {

  // A URL has to point at an audio file. Some hosts serve a web page and can
  // never work; a couple of others just need rewriting into a direct link.
  // YouTube is not here: the panel plays it directly.
  var PAGE_HOSTS = [
    'soundcloud.com', 'open.spotify.com', 'spotify.com', 'music.apple.com',
    'twitch.tv', 'mixcloud.com', 'bandcamp.com', 'deezer.com', 'tidal.com',
    'audiomack.com'
  ];

  function normaliseUrl(raw) {
    var url = (raw || '').trim();
    if (!/^https?:\/\//i.test(url)) {
      return { error: 'Needs to start with http:// or https://' };
    }

    var host = (url.match(/^https?:\/\/([^/:]+)/i) || [])[1] || '';
    host = host.toLowerCase().replace(/^www\./, '');

    // Dropbox share links are pages; the raw variant is the file
    if (host === 'dropbox.com' || host === 'dl.dropbox.com') {
      var clean = url.replace(/^https?:\/\/[^/]+/i, 'https://dl.dropboxusercontent.com')
                     .replace(/[?&]dl=[01]/i, '')
                     .replace(/\?$/, '');
      return { url: clean + (clean.indexOf('?') === -1 ? '?raw=1' : '&raw=1') };
    }

    // Drive file links are pages; uc?export=download is the file
    if (host === 'drive.google.com') {
      var id = (url.match(/\/file\/d\/([^/]+)/) || [])[1] ||
               (url.match(/[?&]id=([^&]+)/) || [])[1];
      if (id) return { url: 'https://drive.google.com/uc?export=download&id=' + id };
      return { error: 'Could not find a file id in that Drive link.' };
    }

    // YouTube goes to the panel's own player
    var yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{8,})/i)
          || url.match(/[?&]v=([\w-]{8,})/);
    if (yt && /(^|\.)(youtube\.com|youtu\.be)$/i.test(host)) {
      return { station: 'yt:' + yt[1] };
    }

    for (var i = 0; i < PAGE_HOSTS.length; i++) {
      var bad = PAGE_HOSTS[i];
      if (host === bad || host.slice(-(bad.length + 1)) === '.' + bad) {
        return { error: bad + ' links are web pages, not audio files. Download the ' +
                        'audio and drop the file into html/audio.' };
      }
    }

    if (/\.m3u8(\?|$)/i.test(url)) {
      return { error: 'HLS playlists are not supported. Use a direct file or stream.' };
    }

    var looksLikeFile = /\.(mp3|ogg|oga|opus|wav|m4a|aac|flac|webm|mp4)(\?|$)/i.test(url);
    return { url: url, hint: looksLikeFile ? null :
      'That has no audio file extension. It will still be tried, but it needs to serve audio directly.' };
  }

    var node = document.querySelector('[data-radio]');

    if (state) {

      var vol = row.querySelector('[data-room-volume]');

  function commitPendingUrl(result) {
    var pending = S.pendingUrl;
    if (!pending) return;

    clearTimeout(S.probeTimer);

    if (result && result.ok === false) {
      var note = document.querySelector('[data-url-note]');
      var box  = document.querySelector('[data-url-input]');
      if (note) { note.textContent = result.message; note.classList.add('is-bad'); }
      if (box)  { box.classList.add('is-bad'); setTimeout(function () { box.classList.remove('is-bad'); }, 1200); }
      Sound.off();
      S.pendingUrl = null;
      return;
    }

    var spk = speaker(pending.room);
    S.pendingUrl = null;
    if (!spk) return;

    spk.station = 'url:' + pending.url;
    spk.power   = true;
    spk.paused  = false;
    Sound.press();
    closePicker();
    paintRadio();
    pushRoom(spk);
  }
