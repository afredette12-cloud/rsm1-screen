  // -------------------------------------------------------------- painting

  // 0 shut, 1 fully out, for one stage at a given master percent
  function stageProgress(dev, stage, pct, dir) {
    if (!stage) return pct / 100;

    var closing = dir === 'close';
    var total   = (closing ? dev.closeTotal : dev.openTotal) || dev.travelTime || 2500;
    var delay   = closing ? stage.closeDelay : stage.openDelay;
    var dur     = Math.max(1, closing ? stage.closeTime : stage.openTime);

    var p       = Math.max(0, Math.min(100, pct)) / 100;
    var elapsed = (closing ? (1 - p) : p) * total;
    var eased   = ease(Math.max(0, Math.min(1, (elapsed - delay) / dur)));

    return closing ? 1 - eased : eased;
  }

  function padEntry() {
    if (S.pad == null) S.pad = '';
    return S.pad;
  }

  function paintPad() {
    var entry = padEntry();
    document.querySelectorAll('[data-lockscreen] [data-dot]').forEach(function (d, i) {
      d.classList.toggle('is-set', i < entry.length);
    });
  }

  function deviceById(id) {
    for (var i = 0; i < S.devices.length; i++) if (S.devices[i].id === id) return S.devices[i];
    return null;
  }

  function paint(id) {
    var pct   = S.display[id] || 0;
    var shown = Math.round(pct);

    var dev     = deviceById(id);
    var isMover = !!(dev && dev.type === 'mover');
    var isWave  = !!(dev && dev.type === 'wave');

    document.querySelectorAll('[data-device="' + id + '"]').forEach(function (node) {
      var blind = node.querySelector('[data-blind]');
      if (blind) blind.style.height = pct.toFixed(2) + '%';

      // doors and pedestal each run their own slice of the sequence
      var lidA = node.querySelector('[data-lid-a]');
      var lidB = node.querySelector('[data-lid-b]');
      var rise = node.querySelector('[data-riser]');

      // a plain lift has no lids: the deck just travels
      if (dev && dev.verb === 'lift' && rise) {
        rise.style.transform = 'translateY(' + (46 - pct * 0.46).toFixed(2) + '%)';
        rise.style.opacity = '1';
      }

      if (lidA && lidB) {
        var dir    = (S.anim[id] && S.anim[id].tr && S.anim[id].tr.dir)
                     || (pct >= 50 ? 'open' : 'close');
        var stages = (dev && dev.stages) || {};

        var slide = stageProgress(dev || {}, stages.slide, pct, dir) * 62;
        var lift  = stages.lift ? stageProgress(dev || {}, stages.lift, pct, dir) * 9 : 0;

        // the lids rise clear before they part, and drop back only once home
        lidA.style.transform = 'translate(-' + slide.toFixed(2) + '%, -' + lift.toFixed(2) + '%)';
        lidB.style.transform = 'translate(' + slide.toFixed(2) + '%, -' + lift.toFixed(2) + '%)';

        if (rise) {
          var up = stageProgress(dev || {}, stages.rise, pct, dir);
          rise.style.transform = 'translate(-50%, ' + (100 - up * 82).toFixed(2) + '%)';
          rise.style.opacity = up > 0.02 ? '1' : '0';
        }
      }

      var meta = node.querySelector('[data-meta]');
      if (meta) {
        if (isWave) {
          meta.textContent = shown >= 50 ? t('running') : t('off');
        } else if (isMover) {
          // 0 is shut, 100 is wide open - the opposite sense to a blind
          var mv = verbs(dev);
          meta.textContent = shown >= 100 ? mv.atGo
                          : shown <= 0 ? mv.atBack
                          : shown + '% ' + mv.go.toLowerCase();
        } else {
          meta.textContent = shown <= 0 ? t('open')
                          : shown >= 100 ? t('closed')
                          : shown + '% ' + t('lowered');
        }
      }

      var toggle = node.querySelector('[data-toggle]');
      if (toggle) toggle.classList.toggle('is-on', shown > 0);
      if (isWave) {
        var want = shown >= 50;
        var cur  = S.waveBlend[id];
        if (!cur || (cur.to === 1) !== want) setWaveTarget(dev, want);
      }

      var busy = isMover && !!S.anim[id];
      node.classList.toggle('is-busy', busy);

      node.querySelectorAll('[data-value]').forEach(function (b) {
        b.classList.toggle('is-current', Math.abs(+b.dataset.value - shown) < 1);
        b.disabled = busy;
      });
    });
  }

  function setValue(id, pct) {
    S.display[id] = Math.max(0, Math.min(100, pct));
    paint(id);
  }

  function animate(id, from, to, elapsed) {
    var dev = device(id);
    if (!dev) return;

    var tr = buildTravel(dev, from, to);
    if (tr.total <= 0) { delete S.anim[id]; setValue(id, to); return; }

    S.anim[id] = { tr: tr, start: performance.now() - (elapsed || 0) };
    paint(id);
    requestAnimationFrame(tick);
  }

  var ticking = false;
  function tick() {
    var now  = performance.now();
    var busy = false;

    Object.keys(S.anim).forEach(function (id) {
      var a    = S.anim[id];
      var e    = now - a.start;
      var done = e >= a.tr.total;

      // clear it BEFORE the last paint, or that paint still reads as busy and
      // leaves the controls disabled with nothing left to repaint them
      if (done) delete S.anim[id];

      setValue(id, travelAt(a.tr, e));
      if (!done) busy = true;
    });

    ticking = busy;
    if (busy) requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------ interaction

  function commit(id, pct) {
    pct = Math.max(0, Math.min(100, pct));
    post('setDevice', { id: id, value: pct });

    if (!IS_NUI) {
      var from = S.display[id] || 0;
      setTimeout(function () { animate(id, from, pct, 0); }, 50);
    }
  }

  content.addEventListener('input', function (e) {
    var svol = e.target.closest('[data-screen-vol]');
    if (svol) {
      var vHost = svol.closest('[data-screen]');
      var vOut  = vHost.querySelector('[data-screen-vol-val]');
      if (vOut) vOut.textContent = svol.value + '%';
      (S.screens || []).forEach(function (x) {
        if (x.id === vHost.dataset.screen) x.volume = +svol.value;
      });
      return;
    }

    var vol = e.target.closest('[data-room-volume]');
    if (vol) {
      var row = vol.closest('[data-room]');
      var spk = speaker(row.dataset.room);
      if (!spk) return;

      S.draggingVolume = spk.id;
      spk.volume = +vol.value;

      var pct = row.querySelector('[data-room-pct]');
      if (pct) pct.textContent = spk.volume + '%';
      return;
    }

    var hg = e.target.closest('[data-height]');
    if (hg) {
      var hHost = hg.closest('[data-device]');
      var hDev  = deviceById(hHost.dataset.device);
      if (hDev) {
        setWaveHeight(hDev, +hg.value);
        var hOut = hHost.querySelector('[data-height-val]');
        if (hOut) hOut.textContent = hDev.height + '%';
      }
      return;
    }

    var sp = e.target.closest('[data-speed]');
    if (sp) {
      var host = sp.closest('[data-device]');
      var d2   = deviceById(host.dataset.device);
      if (d2) {
        d2.speed = +sp.value;
        var out2 = host.querySelector('[data-speed-val]');
        if (out2) out2.textContent = Math.round(wavePeriod(d2)) / 1000 + 's';
      }
      return;
    }

    var band = e.target.closest('[data-eq]');
    if (band) {
      var id = band.dataset.eq;
      S.radio.eq = S.radio.eq || { low: 0, mid: 0, high: 0 };
      S.radio.eq[id] = +band.value;

      var out = document.querySelector('[data-eq-val="' + id + '"]');
      if (out) out.textContent = fmtDb(S.radio.eq[id]);
    }
  });

  content.addEventListener('change', function (e) {
    var surl = e.target.closest('[data-screen-url]');
    if (surl) {
      var uHost = surl.closest('[data-screen]');
      var url   = surl.value.trim();
      (S.screens || []).forEach(function (x) { if (x.id === uHost.dataset.screen) x.url = url || null; });
      Sound.tap();
      post('setScreen', { id: uHost.dataset.screen, url: url });
      return;
    }

    var svol2 = e.target.closest('[data-screen-vol]');
    if (svol2) {
      Sound.tap();
      post('setScreen', { id: svol2.closest('[data-screen]').dataset.screen,
                          volume: +svol2.value });
      return;
    }

    var vol = e.target.closest('[data-room-volume]');
    if (vol) {
      var row = vol.closest('[data-room]');
      var spk = speaker(row.dataset.room);
      S.draggingVolume = null;
      if (spk) { spk.volume = +vol.value; Sound.tap(); pushRoom(spk); }
      return;
    }

    var hg2 = e.target.closest('[data-height]');
    if (hg2) {
      Sound.tap();
      post('setDeviceValue', { id: hg2.closest('[data-device]').dataset.device,
                               field: 'height', value: +hg2.value });
      return;
    }

    var sp2 = e.target.closest('[data-speed]');
    if (sp2) {
      Sound.tap();
      post('setDeviceValue', { id: sp2.closest('[data-device]').dataset.device,
                               field: 'speed', value: +sp2.value });
      return;
    }

    if (e.target.closest('[data-eq]')) {
      Sound.tap();
      post('setEq', S.radio.eq);
    }
  });

  content.addEventListener('click', function (e) {
    var camHost = e.target.closest('[data-camera]');
    if (camHost && e.target.closest('[data-cam-view]')) {
      Sound.press();
      post('openCamera', { id: camHost.dataset.camera });
      return;
    }

    var scPow = e.target.closest('[data-screen-power]');
    if (scPow) {
      var pHost = scPow.closest('[data-screen]');
      var want  = scPow.dataset.screenPower === '1';
      want ? Sound.on() : Sound.off();
      post('setScreen', { id: pHost.dataset.screen, power: want });
      return;
    }

    var scCC = e.target.closest('[data-screen-cc]');
    if (scCC) {
      var cHost = scCC.closest('[data-screen]');
      var cSc = (S.screens || []).filter(function (x) { return x.id === cHost.dataset.screen; })[0];
      if (cSc) {
        cSc.subtitles = !cSc.subtitles;
        scCC.classList.toggle('is-on', cSc.subtitles);
        Sound.tap();
        post('setScreen', { id: cSc.id, subtitles: cSc.subtitles });
      }
      return;
    }

    var scMute = e.target.closest('[data-screen-mute]');
    if (scMute) {
      var mHost = scMute.closest('[data-screen]');
      var mSc = (S.screens || []).filter(function (x) { return x.id === mHost.dataset.screen; })[0];
      if (mSc) {
        mSc.muted = !mSc.muted;
        scMute.classList.toggle('is-on', !mSc.muted);
        mSc.muted ? Sound.off() : Sound.on();
        post('setScreen', { id: mSc.id, muted: mSc.muted });
      }
      return;
    }

    var scTog = e.target.closest('[data-screen-toggle]');
    if (scTog) {
      var h2 = scTog.closest('[data-screen]');
      var sc = (S.screens || []).filter(function (x) { return x.id === h2.dataset.screen; })[0];
      if (sc) {
        var field = h2.querySelector('[data-screen-url]');
        var typed = field ? field.value.trim() : '';
        if (!sc.playing && !sc.url && !typed) { Sound.off(); return; }

        sc.playing = !sc.playing;
        sc.playing ? Sound.on() : Sound.off();
        // carry a freshly typed link along, so paste-then-toggle just works
        var msg = { id: sc.id, playing: sc.playing };
        if (typed && typed !== sc.url) { msg.url = typed; sc.url = typed; }
        post('setScreen', msg);
      }
      return;
    }

    if (e.target.closest('[data-doors]')) {
      S.doorsOpen = true; Sound.tap(); render(); return;
    }

    if (e.target.closest('[data-doors-back]')) {
      S.doorsOpen = false; Sound.tap(); render(); return;
    }

    var allDoors = e.target.closest('[data-alldoors]');
    if (allDoors) {
      var lock = allDoors.dataset.alldoors === '1';
      (S.doors || []).forEach(function (d) { d.locked = lock; });
      lock ? Sound.on() : Sound.off();
      post('setAllDoors', { locked: lock });
      render();
      return;
    }

    var doorRow = e.target.closest('[data-door]');
    if (doorRow && e.target.closest('[data-door-lock]')) {
      var id = doorRow.dataset.door;
      (S.doors || []).forEach(function (d) {
        if (d.id !== id) return;
        d.locked = !d.locked;
        d.locked ? Sound.on() : Sound.off();
        post('setDoor', { id: id, locked: d.locked });
      });
      render();
      return;
    }

    if (e.target.closest('[data-privacy]')) {
      S.lockOpen = true;
      S.pad = '';
      Sound.tap();
      render();
      return;
    }

    if (e.target.closest('[data-lock-back]')) {
      S.lockOpen = false;
      S.pad = '';
      Sound.tap();
      render();
      return;
    }

    var key = e.target.closest('[data-key]');
    if (key) {
      var screen = key.closest('[data-lockscreen]');
      var len    = (screen && +screen.dataset.codelen) || 4;
      var what   = key.dataset.key;

      // clearing on submit rather than on the reply, so a slow or missing
      // answer cannot be turned into repeat guesses by hammering the tick
      var submit = function () {
        var code = padEntry();
        S.pad = '';
        Sound.tap();
        post('tryCode', { code: code });
      };

      if (what === 'clear') {
        S.pad = padEntry().slice(0, -1);
        Sound.tap();
      } else if (what === 'enter') {
        if (padEntry().length === len) submit(); else shakePad();
      } else if (padEntry().length < len) {
        S.pad = padEntry() + what;
        Sound.tap();

        // a full-length entry submits itself, so there is no reaching for
        // the tick after every digit
        if (S.pad.length === len) submit();
      }

      paintPad();
      return;
    }

    var pick = e.target.closest('[data-pick]');
    if (pick) {
      var pk  = pick.closest('[data-picker]');
      var spk = speaker(pk.dataset.picker);
      if (spk) {
        spk.station = pick.dataset.pick;
        if (!spk.power) spk.power = true;
        Sound.press();
        closePicker();
        paintRadio();
        pushRoom(spk);
      }
      return;
    }

    // Import hands the link to the server's configured tool, which turns a
    // page into a file. Add just plays the link as-is.
    if (e.target.closest('[data-url-import]')) {
      var ibox = document.querySelector('[data-url-input]');
      var inote = document.querySelector('[data-url-note]');
      var ipk  = e.target.closest('[data-picker]');
      var iurl = (ibox && ibox.value || '').trim();

      if (!/^https?:\/\//i.test(iurl)) {
        if (inote) { inote.textContent = 'Needs to start with http:// or https://'; inote.classList.add('is-bad'); }
        Sound.off();
        return;
      }

      S.importing = ipk.dataset.picker;
      if (inote) { inote.classList.remove('is-bad'); inote.textContent = t('importing'); }
      Sound.tap();
      post('importUrl', { id: ipk.dataset.picker, url: iurl });
      return;
    }

    if (e.target.closest('[data-url-add]')) {
      var box  = document.querySelector('[data-url-input]');
      var note = document.querySelector('[data-url-note]');
      var pk2  = e.target.closest('[data-picker]');
      var sp2  = speaker(pk2.dataset.picker);
      var res  = normaliseUrl(box && box.value);

      if (res.error) {
        box.classList.add('is-bad');
        if (note) { note.textContent = res.error; note.classList.add('is-bad'); }
        Sound.off();
        setTimeout(function () { box.classList.remove('is-bad'); }, 1200);
        return;
      }

      if (!sp2) return;

      // A YouTube link needs no probing - the panel's player handles it.
      if (res.station) {
        sp2.station = res.station;
        sp2.power   = true;
        sp2.paused  = false;
        Sound.press();
        closePicker();
        paintRadio();
        pushRoom(sp2);
        return;
      }

      // Ask the server what that URL actually serves before committing to it.
      // Extensions lie in both directions, so guessing is not good enough.
      S.pendingUrl = { room: sp2.id, url: res.url };
      if (note) {
        note.classList.remove('is-bad');
        note.textContent = t('checking');
      }
      post('probeUrl', { url: res.url });

      clearTimeout(S.probeTimer);
      S.probeTimer = setTimeout(function () { commitPendingUrl(null); }, 7000);
      return;
    }

    if (e.target.closest('[data-eq-toggle]')) {
      S.eqOpen = !S.eqOpen;
      Sound.tap();
      var panel = document.querySelector('[data-eq-panel]');
      var btn   = e.target.closest('[data-eq-toggle]');
      if (panel) panel.classList.toggle('hidden', !S.eqOpen);
      if (btn) btn.classList.toggle('is-on', S.eqOpen);
      return;
    }

    var hset = e.target.closest('[data-height-set]');
    if (hset) {
      var hh   = hset.closest('[data-device]');
      var hdev = deviceById(hh.dataset.device);
      var hv   = +hset.dataset.heightSet;

      if (hdev) {
        setWaveHeight(hdev, hv);
        var sl2 = hh.querySelector('[data-height]');
        var vl2 = hh.querySelector('[data-height-val]');
        if (sl2) sl2.value = hv;
        if (vl2) vl2.textContent = hv + '%';
        Sound.press();
        post('setDeviceValue', { id: hh.dataset.device, field: 'height', value: hv });
      }
      return;
    }

    var pre = e.target.closest('[data-eq-preset]');
    if (pre) {
      var list = (S.radio && S.radio.eqPresets) || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === pre.dataset.eqPreset) {
          S.radio.eq = { low: list[i].low, mid: list[i].mid, high: list[i].high };
          break;
        }
      }
      Sound.press();
      ['low', 'mid', 'high'].forEach(function (bandId) {
        var sl = document.querySelector('[data-eq="' + bandId + '"]');
        var vl = document.querySelector('[data-eq-val="' + bandId + '"]');
        if (sl) sl.value = S.radio.eq[bandId];
        if (vl) vl.textContent = fmtDb(S.radio.eq[bandId]);
      });
      post('setEq', S.radio.eq);
      return;
    }

    var roomHost = e.target.closest('[data-room]');
    if (roomHost) {
      var rspk = speaker(roomHost.dataset.room);
      if (!rspk) return;

      if (e.target.closest('[data-room-power]')) {
        rspk.power = !rspk.power;
        if (rspk.power) rspk.paused = false;
        rspk.power ? Sound.on() : Sound.off();

        if (rspk.power && S.radio.exclusive) {
          (S.radio.speakers || []).forEach(function (o) { if (o.id !== rspk.id) o.power = false; });
          (S.radio.speakers || []).forEach(function (o) { if (o.id !== rspk.id) pushRoom(o); });
        }

        paintRadio();
        pushRoom(rspk);
        return;
      }

      if (e.target.closest('[data-room-play]')) {
        if (!rspk.power) {
          rspk.power = true; rspk.paused = false; Sound.on();
        } else {
          rspk.paused = !rspk.paused;
          rspk.paused ? Sound.off() : Sound.on();
        }
        paintRadio();
        pushRoom(rspk);
        return;
      }

      if (e.target.closest('[data-room-pick]')) {
        Sound.tap();
        var already = document.querySelector('[data-picker="' + rspk.id + '"]');
        if (already) closePicker(); else openPicker(rspk.id);
        return;
      }
      return;
    }

    if (!e.target.closest('[data-picker]')) closePicker();

    var scene = e.target.closest('[data-scene]');
    if (scene) {
      var target = +scene.dataset.scene;
      Sound.press();
      S.devices.forEach(function (d) {
        if (d.type === 'blinds') commit(d.id, target);
      });
      return;
    }

    var goTo = e.target.closest('[data-goto]');
    if (goTo) { Sound.tap(); setView(goTo.dataset.goto); return; }

    var host = e.target.closest('[data-device]');
    if (!host) return;
    var id = host.dataset.device;

    var preset = e.target.closest('[data-value]');
    if (preset) { Sound.press(); commit(id, +preset.dataset.value); return; }

    if (e.target.closest('[data-toggle]')) {
      var down = (S.display[id] || 0) > 0;
      down ? Sound.off() : Sound.on();
      commit(id, down ? 0 : 100);
    }
  });

  function setView(view) {
    S.view = view;
    document.querySelectorAll('.nav-item').forEach(function (b) {
      b.classList.toggle('is-active', b.dataset.view === view);
    });
    if (view !== 'home') {
      S.tab = 'hub';
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.tab === 'hub');
      });
    }
    render();
  }

  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nav-item');
    if (b) { Sound.tap(); setView(b.dataset.view); }
  });

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    Sound.tap();
    S.tab  = b.dataset.tab;
    S.view = 'home';
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('is-active', x === b); });
    document.querySelectorAll('.nav-item').forEach(function (x) {
      x.classList.toggle('is-active', x.dataset.view === 'home');
    });
    render();
  });

  document.querySelectorAll('[data-close]').forEach(function (n) {
    n.addEventListener('click', closePanel);
  });

  document.addEventListener('keydown', function (e) {
    if (!S.open) return;

    // typing in a field: Backspace is editing, not closing. Escape still
    // leaves, but drops focus first so the next one closes cleanly.
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (typing) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }

    // the code screen takes the keyboard: number row or numpad for digits,
    // Backspace to rub one out, Enter to submit
    if (S.lockOpen) {
      var digit = null;
      if (/^[0-9]$/.test(e.key)) digit = e.key;
      else if (/^Numpad[0-9]$/.test(e.code)) digit = e.code.slice(-1);

      var screen = document.querySelector('[data-lockscreen]');
      var len    = (screen && +screen.dataset.codelen) || 4;

      var submit = function () {
        var code = padEntry();
        S.pad = '';
        Sound.tap();
        post('tryCode', { code: code });
      };

      if (digit !== null) {
        if (padEntry().length < len) {
          S.pad = padEntry() + digit;
          Sound.tap();
          if (S.pad.length === len) submit();
        }
        paintPad();
        e.preventDefault();
        return;
      }
      if (e.key === 'Backspace') {
        S.pad = padEntry().slice(0, -1);
        Sound.tap();
        paintPad();
        e.preventDefault();
        return;
      }
      if (e.key === 'Enter') {
        if (padEntry().length === len) submit(); else shakePad();
        e.preventDefault();
        return;
      }
      if (e.key === 'Escape') {
        S.lockOpen = false; S.pad = ''; Sound.tap(); render();
        e.preventDefault();
        return;
      }
      return;
    }

    if (e.key === 'Escape' || e.key === 'Backspace') closePanel();
  });

  // ----------------------------------------------------------------- open

  function applyText() {
    document.querySelectorAll('[data-t]').forEach(function (n) {
      n.textContent = t(n.dataset.t, n.textContent);
    });

    var brand = S.ui.brand || {};
    var logo  = document.getElementById('brandLogo');
    var name  = document.getElementById('brandName');
    var rule  = document.getElementById('brandRule');

    if (brand.logo) {
      logo.src = brand.logo;
      logo.classList.remove('hidden');
      name.classList.add('hidden');
      rule.classList.add('hidden');
    } else {
      logo.classList.add('hidden');
      name.classList.remove('hidden');
      rule.classList.remove('hidden');
      name.textContent = brand.name || '';
    }

    document.getElementById('brandTag').textContent = brand.tagline || '';
  }

  function openPanel(data) {
    S.open     = true;
    S.locale   = data.locale || {};
    S.ui       = data.ui || {};
    S.property = data.property;
    S.devices  = data.devices || [];
    S.env      = data.env || {};
    S.radio    = data.radio || { enabled: false };
    S.eqOpen   = false;
    S.waveBlend = {};
    S.screens   = data.screens || [];
    S.doors     = data.doors || [];
    S.doorsOpen = false;
    S.privacy   = data.privacy || null;
    S.lockOpen  = false;
    S.pad       = '';
    S.waveRest  = {};
    S.cameras  = data.cameras || { enabled: false, list: [] };
    S.view     = 'home';
    S.tab      = 'hub';

    S.anim = {};
    S.devices.forEach(function (d) { S.display[d.id] = d.value || 0; });

    applyText();
    setView('home');
    root.classList.remove('hidden');
    Sound.open();
  }

  function closePanel() {
    if (!S.open) return;
    S.open = false;
    Sound.close();
    root.classList.add('hidden');
    post('close', {});
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data || {};

    // audio runs whether or not the panel is on screen
    if (d.action === 'audioPlay')     return Audio3D.play(d);
    if (d.action === 'audioStop')     return Audio3D.stop(d.id, d.fade);
    if (d.action === 'audioStopAll')  { Audio3D.stopAll(true); YTAudio.stopAll(); return; }
    if (d.action === 'audioEq')       return Audio3D.setEq(d.eq || {});
    if (d.action === 'audioPause')    return Audio3D.pause(d.id, d.paused);
    if (d.action === 'audioVolume')   return Audio3D.volume(d.id, d.volume);
    if (d.action === 'audioListener') { Audio3D.listener(d); YTAudio.listener(d); return; }
    if (d.action === 'ytPlay')        return YTAudio.play(d);
    if (d.action === 'ytStop')        return YTAudio.stop(d.id, d.fade);
    if (d.action === 'ytVolume')      return YTAudio.volume(d.id, d.volume);
    if (d.action === 'ytPause')       return YTAudio.pause(d.id, d.paused);
    if (d.action === 'audioDebug')    return Audio3D.debug();

    if (d.action === 'open')   return openPanel(d);
    if (d.action === 'close')  return closePanel();
    if (d.action === 'device') return animate(d.id, d.from, d.to, d.elapsed);
    if (d.action === 'radio') {
      (S.radio.speakers || []).forEach(function (spk) {
        var r = d.speakers && d.speakers[spk.id];
        if (r) {
          spk.power   = r.power;
          spk.paused  = r.paused;
          spk.station = r.station;
          if (r.volume != null && S.draggingVolume !== spk.id) spk.volume = r.volume;
        }
      });
      paintRadio();
      return;
    }

    if (d.action === 'importStatus') {
      var inote = document.querySelector('[data-url-note]');
      var r = d.result || {};

      if (r.busy) {
        if (inote) { inote.classList.remove('is-bad'); inote.textContent = r.message || t('importing'); }
        return;
      }

      if (r.ok) {
        Sound.press();
        S.importing = null;
        closePicker();
        return;
      }

      S.importing = null;
      if (inote) { inote.textContent = r.message || 'Import failed.'; inote.classList.add('is-bad'); }
      Sound.off();
      return;
    }

    if (d.action === 'urlProbe') {
      if (S.pendingUrl && S.pendingUrl.url === d.url) commitPendingUrl(d.result);
      return;
    }

    if (d.action === 'sources') {
      S.radio.sources = d.sources || [];
      var pickerEl = document.querySelector('[data-picker]');
      if (pickerEl) openPicker(pickerEl.dataset.picker);
      paintRadio();
      return;
    }

    if (d.action === 'screens') {
      (S.screens || []).forEach(function (sc) {
        var st = d.screens[sc.id];
        if (!st) return;
        sc.url     = st.url;
        sc.playing = !!st.playing;
        if (st.volume != null) sc.volume = st.volume;
        sc.muted = !!st.muted;
        sc.power = st.power !== false;
        sc.subtitles = !!st.subtitles;

        var host = document.querySelector('[data-screen="' + sc.id + '"]');
        if (!host) return;

        var power = sc.power !== false;
        var on    = power && sc.playing && sc.url;
        var pb = host.querySelector('[data-screen-toggle]');
        pb.classList.toggle('is-on', !!on);      // the CSS morphs the path
        pb.title = on ? t('pause') : t('play');
        var tv = host.querySelector('.tv');
        tv.classList.toggle('is-on', !!on);
        tv.classList.toggle('is-off', !power);
        host.querySelector('[data-tv]').textContent = on ? '' : (power ? t('no_signal') : '');
        host.querySelector('[data-screen-meta]').textContent =
          !power ? t('screen_off') : (on ? t('playing') : t('off'));
        var cc = host.querySelector('[data-screen-cc]');
        if (cc) cc.classList.toggle('is-on', !!sc.subtitles);
        host.querySelectorAll('[data-screen-power]').forEach(function (b) {
          b.classList.toggle('is-current', (b.dataset.screenPower === '1') === power);
        });

        var input = host.querySelector('[data-screen-url]');
        if (input && document.activeElement !== input) input.value = sc.url || '';

        var vs = host.querySelector('[data-screen-vol]');
        var vv = host.querySelector('[data-screen-vol-val]');
        if (vs && document.activeElement !== vs) vs.value = sc.volume;
        if (vv) vv.textContent = sc.volume + '%';
        var mb = host.querySelector('[data-screen-mute]');
        if (mb) mb.classList.toggle('is-on', !sc.muted);

        // the mute tag is part of the meta line, so rebuild that bit
        var meta = host.querySelector('.card-meta');
        var tag  = meta && meta.querySelector('[data-muted-tag]');
        if (meta && sc.muted && !tag) {
          var sp = document.createElement('span');
          sp.className = 'flat-tag flat-tag--warn';
          sp.setAttribute('data-muted-tag', '');
          sp.textContent = t('muted');
          meta.appendChild(sp);
        } else if (tag && !sc.muted) {
          tag.remove();
        }
      });
      return;
    }

    if (d.action === 'doors') {
      (S.doors || []).forEach(function (x) {
        if (d.doors[x.id] !== undefined) x.locked = !!d.doors[x.id];
      });
      if (S.doorsOpen) render();
      return;
    }

    if (d.action === 'codeResult') {
      S.pad = '';
      paintPad();

      if (d.ok) {
        Sound.on();
        S.lockOpen = false;
        // the panel is rebuilt by the open payload that follows, which now
        // carries the cameras and the gated devices
      } else {
        shakePad();
        Sound.off();

        var sub = document.querySelector('[data-lock-sub]');
        if (sub) {
          sub.textContent = d.wait ? (t('too_many') + ' ' + d.wait + 's') : t('wrong_code');
          sub.classList.add('is-bad');
          setTimeout(function () {
            if (sub) { sub.textContent = t('enter_code'); sub.classList.remove('is-bad'); }
          }, 2200);
        }
      }
      return;
    }

    if (d.action === 'deviceValue') {
      var dv = deviceById(d.id);
      if (!dv) return;

      var host3 = document.querySelector('[data-device="' + d.id + '"]');

      if (d.field === 'speed') {
        dv.speed = d.value;
        if (host3) {
          var sl = host3.querySelector('[data-speed]');
          var vl = host3.querySelector('[data-speed-val]');
          if (sl) sl.value = d.value;
          if (vl) vl.textContent = Math.round(wavePeriod(dv)) / 1000 + 's';
        }
      } else if (d.field === 'height') {
        setWaveHeight(dv, d.value);
        if (host3) {
          var sl3 = host3.querySelector('[data-height]');
          var vl3 = host3.querySelector('[data-height-val]');
          if (sl3) sl3.value = d.value;
          if (vl3) vl3.textContent = d.value + '%';
        }
      }
      return;
    }

    if (d.action === 'eq') {
      S.radio.eq = d.eq || S.radio.eq;
      ['low', 'mid', 'high'].forEach(function (b2) {
        var sl = document.querySelector('[data-eq="' + b2 + '"]');
        var vl = document.querySelector('[data-eq-val="' + b2 + '"]');
        if (sl) sl.value = S.radio.eq[b2];
        if (vl) vl.textContent = fmtDb(S.radio.eq[b2]);
      });
      return;
    }
    if (d.action === 'env') {
      S.env = d.env || {};
      if (S.radio) {
        var was = S.radio.current && S.radio.current.id;
        S.radio.current = d.current || null;
        if ((d.current && d.current.id) !== was) repaintNowPlaying();
      }
      repaintEnv();
      return;
    }
  });
