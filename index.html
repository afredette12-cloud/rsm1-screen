<!--
  rf_rsm1h screen player  -  version 1.38.1
  Published at https://afredette12-cloud.github.io/rsm1-screen/

  REPLACE index.html IN THE REPO WITH THIS FILE.
  The version shows on the idle screen in game, so you can see at a glance
  whether what is deployed matches your resource.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube error 153 means the embed reached it without a usable Referer.
     A no-referrer policy guarantees that, so ask for the one YouTube wants. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               background: #000; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%;
               border: 0; object-fit: contain; background: #000; }
  #idle { display: grid; place-items: center; color: #2a2a30;
          font: 300 34px system-ui, sans-serif; letter-spacing: .18em;
          text-align: center; line-height: 1.5; }
  #idle .ver { display: block; font-size: 13px; letter-spacing: .1em; color: #1e1e24; }
</style>
</head>
<body>
<div id="stage"><div id="idle">NO SIGNAL</div></div>
<script>
/* Runs inside the DUI, not the pad. Shows one video on the screen prop.
   The pad talks to it through SendDuiMessage. */
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var cur   = null;          // { kind, el, api }
  var want  = { url: null, seek: 0, playing: false, volume: 1 };

  function clear() {
    stage.innerHTML = '';
    cur = null;
  }

  // The version is on screen so a stale hosted page is obvious at a glance -
  // this page lives outside the resource, so restarting the script cannot
  // update it and there is otherwise no way to tell which one is deployed.
  var PLAYER_VERSION = '1.38.1';

  function idle() {
    clear();
    var d = document.createElement('div');
    d.id = 'idle';
    d.innerHTML = 'NO SIGNAL<span class="ver">player ' + PLAYER_VERSION + '</span>';
    stage.appendChild(d);
  }

  // ---- what kind of link is this ----------------------------------------
  function youtubeId(u) {
    var m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function twitchChannel(u) {
    var m = u.match(/twitch\.tv\/([A-Za-z0-9_]+)/);
    return (m && m[1] !== 'videos') ? m[1] : null;
  }

  function twitchVideo(u) {
    var m = u.match(/twitch\.tv\/videos\/(\d+)/);
    return m ? m[1] : null;
  }

  // ---- players -----------------------------------------------------------
  function playFile(url) {
    clear();
    var v = document.createElement('video');
    v.src = url;
    v.autoplay = true;
    v.loop = false;
    v.muted = want.muted;           // muted when the pad handles audio in 3D
    v.volume = want.volume;
    v.playsInline = true;
    v.addEventListener('loadedmetadata', function () {
      if (want.seek > 0 && isFinite(v.duration) && v.duration > 0) {
        try { v.currentTime = want.seek % v.duration; } catch (e) {}
      }
      v.play().catch(function () {});
    });
    stage.appendChild(v);
    cur = { kind: 'file', el: v };
  }

  // Error 153 is YouTube refusing an embed that reached it without a usable
  // Referer. A DUI page is served from nui://, which is not an http origin,
  // so there is nothing valid to send. These are the documented mitigations;
  // if they do not take, the answer is `origin` in the config - a real https
  // page - or resolving the video to a direct file server-side.
  // A bare YouTube iframe has no volume control at all - which is why it
  // played at full blast whatever the pad said. Volume needs the IFrame API,
  // so load it once and drive a real player object.
  var ytReady = false, ytQueue = [];

  function withYT(fn) {
    if (ytReady && window.YT && window.YT.Player) return fn();
    ytQueue.push(fn);
    if (document.getElementById('yt-api')) return;

    var tag = document.createElement('script');
    tag.id  = 'yt-api';
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    var q = ytQueue; ytQueue = [];
    q.forEach(function (fn) { fn(); });
  };

  function applyVolume() {
    if (!cur) return;
    var v = want.muted ? 0 : want.volume;

    if (cur.kind === 'file' && cur.el) {
      cur.el.volume = v;
    } else if (cur.api && cur.api.setVolume) {
      // YouTube takes 0-100, Twitch takes 0-1
      cur.api.setVolume(cur.kind === 'youtube' ? Math.round(v * 100) : v);
    }
  }

  function playYouTube(id) {
    clear();
    var holder = document.createElement('div');
    stage.appendChild(holder);
    cur = { kind: 'youtube', el: holder, api: null };

    withYT(function () {
      if (!cur || cur.el !== holder) return;      // switched away while loading

      var ref = want.origin || 'https://www.youtube.com';
      cur.api = new window.YT.Player(holder, {
        videoId: id,
        host: want.nocookie ? 'https://www.youtube-nocookie.com'
                            : 'https://www.youtube.com',
        playerVars: {
          autoplay: 1, controls: 0, modestbranding: 1, rel: 0,
          playsinline: 1, disablekb: 1, fs: 0, iv_load_policy: 3,
          start: Math.floor(want.seek),
          origin: ref, widget_referrer: ref
        },
        events: {
          onReady: function (e) {
            // set the volume before anything is audible
            e.target.setVolume(want.muted ? 0 : Math.round(want.volume * 100));
            if (want.muted) e.target.mute(); else e.target.unMute();
            if (want.seek > 0) e.target.seekTo(want.seek, true);
            e.target.playVideo();
          }
        }
      });
    });
  }

  function playTwitch(url) {
    clear();
    var holder = document.createElement('div');
    holder.id = 'tw-' + Date.now();
    stage.appendChild(holder);
    cur = { kind: 'twitch', el: holder, api: null };

    var boot = function () {
      if (!cur || cur.el !== holder || !window.Twitch || !window.Twitch.Player) return;

      var ch = twitchChannel(url), vid = twitchVideo(url);
      var opts = { width: '100%', height: '100%', autoplay: true,
                   muted: want.muted, parent: ['cfx.re', 'localhost'] };
      if (vid) opts.video = vid; else if (ch) opts.channel = ch;

      cur.api = new window.Twitch.Player(holder.id, opts);
      cur.api.addEventListener(window.Twitch.Player.READY, function () {
        cur.api.setVolume(want.muted ? 0 : want.volume);
      });
    };

    if (window.Twitch && window.Twitch.Player) return boot();

    var tag = document.getElementById('tw-api');
    if (!tag) {
      tag = document.createElement('script');
      tag.id  = 'tw-api';
      tag.src = 'https://player.twitch.tv/js/embed/v1.js';
      document.head.appendChild(tag);
    }
    tag.addEventListener('load', boot);
  }

  function start() {
    if (!want.url || !want.playing) { idle(); return; }

    var yt = youtubeId(want.url);
    if (yt) return playYouTube(yt);
    if (/twitch\.tv/i.test(want.url)) return playTwitch(want.url);
    playFile(want.url);
  }

  // ---- the pad talks to us ----------------------------------------------
  window.addEventListener('message', function (e) {
    var d = e.data || {};

    if (d.action === 'show') {
      var changed = (d.url !== want.url) || (d.playing !== want.playing)
                 || (d.muted !== want.muted);
      want.url     = d.url || null;
      want.playing = !!d.playing;
      want.seek    = d.seek || 0;
      want.muted   = d.muted !== false;
      want.volume  = (d.volume == null ? 1 : d.volume);
      want.origin  = d.origin || null;
      want.nocookie = !!d.nocookie;
      if (changed) start(); else applyVolume();
      return;
    }

    // distance falloff for anything we cannot route through the 3D graph
    if (d.action === 'volume') {
      want.volume = d.volume;
      applyVolume();
      return;
    }

    if (d.action === 'stop') {
      want.playing = false;
      idle();
      return;
    }

    // keep the picture with the server clock after a long stall
    if (d.action === 'resync' && cur && cur.kind === 'file' && cur.el) {
      var v = cur.el;
      if (isFinite(v.duration) && v.duration > 0) {
        var target = d.seek % v.duration;
        if (Math.abs(v.currentTime - target) > 1.5) {
          try { v.currentTime = target; } catch (e) {}
        }
      }
    }
  });

  idle();
})();

</script>
</body>
</html>
